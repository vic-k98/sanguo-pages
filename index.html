<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>三国·烽火天下</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;background:#0b1018;color:#e8e2d0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
.serif{font-family:"Songti SC","STKaiti","KaiTi","SimSun",serif}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.show{display:flex}
.dim{opacity:.55}
button{font-family:inherit}

/* ===== 主菜单 ===== */
#screen-menu,#screen-setup{
  align-items:center;justify-content:center;gap:14px;padding:24px;
  background:radial-gradient(ellipse 90% 60% at 50% 18%,#1d2c47 0%,#0b1018 70%);
}
#screen-menu h1{font-size:clamp(28px,8vw,46px);margin:0;letter-spacing:clamp(4px,1.8vw,10px);color:#e8c96a;text-shadow:0 2px 18px #e8c96a44;white-space:nowrap}
#screen-menu .sub{font-size:14px;letter-spacing:6px;opacity:.6;margin-bottom:28px}
.menu-btn{
  width:min(78vw,300px);padding:15px;font-size:17px;border-radius:14px;cursor:pointer;
  border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;touch-action:manipulation;
}
.menu-btn:active{transform:scale(.97)}
.menu-btn.primary{background:linear-gradient(#d9b455,#a07f2c);border-color:#e8c96a;color:#221a06;font-weight:700}
#screen-setup h2{margin:4px 0 2px;font-size:22px;color:#e8c96a;letter-spacing:4px}
#fact-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(94vw,520px)}
.fcard{
  border:2px solid #2c3a55;border-radius:14px;padding:12px;background:#141c2b;cursor:pointer;
  transition:border-color .15s,transform .15s;touch-action:manipulation;
}
.fcard.sel{transform:scale(1.02);box-shadow:0 0 18px var(--fc,#fff5) inset,0 0 12px var(--fc,#fff3);border-color:var(--fc,#fff)}
.fcard .fname{font-size:19px;font-weight:700}
.fcard .fdesc{font-size:12px;opacity:.7;margin-top:5px;line-height:1.5}
.fcard .fgen{font-size:11px;margin-top:6px;color:#e8c96a;opacity:.85}
.seg{display:flex;border:1px solid #3a4a66;border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 18px;background:transparent;color:#e8e2d0;border:none;font-size:15px;cursor:pointer;touch-action:manipulation}
.seg button.sel{background:#caa64b;color:#221a06;font-weight:700}
.setup-row{display:flex;align-items:center;gap:12px;font-size:14px;opacity:.95}

/* ===== 游戏画面 ===== */
#map-wrap{position:absolute;inset:0;background:#08111f}
#map-svg{width:100%;height:100%;touch-action:none;display:block}
#topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:rgba(11,16,24,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #232f47;font-size:13px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
.res{display:inline-flex;align-items:center;gap:3px;background:#16213399;border:1px solid #2a3650;border-radius:999px;padding:4px 10px;flex:none}
#tb-fact{font-weight:700;border-color:#caa64b66;color:#e8c96a}
.icon-btn{
  flex:none;width:34px;height:34px;border-radius:10px;border:1px solid #3a4a66;background:#1d2940;
  color:#e8e2d0;font-size:16px;cursor:pointer;touch-action:manipulation;padding:0;
}
.icon-btn:active{transform:scale(.93)}
#topbar .spacer{flex:1;min-width:4px}
#btn-endturn{
  position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:25;
  padding:15px 24px;font-size:17px;font-weight:800;border-radius:999px;cursor:pointer;letter-spacing:2px;
  border:1px solid #e8c96a;background:linear-gradient(#d9b455,#9a7a28);color:#221a06;
  box-shadow:0 4px 22px #d9b45566;touch-action:manipulation;transition:opacity .2s;
}
#btn-endturn:active{transform:scale(.96)}
@media (max-width:899px){
  body.panel-open #btn-endturn{opacity:0;pointer-events:none}
}

/* ===== 地图元素 ===== */
.edge{stroke:#46566f;stroke-width:2.5;opacity:.6;stroke-dasharray:2 7;stroke-linecap:round}
.edge.r{stroke:#4a7fae;opacity:.75}
.edge.m{stroke:#8a7a55;opacity:.7}
.ebadge-bg{fill:#0f1828;stroke:#2e3c58;stroke-width:1.2}
.ebadge{font-size:11px;text-anchor:middle;pointer-events:none}
.outer-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#9ab48e;opacity:.42;text-anchor:middle;letter-spacing:7px}
.outer-sub{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#8fa789;opacity:.32;text-anchor:middle;letter-spacing:3px}
.lake{fill:#1d3a5c;stroke:#3a679a;stroke-width:1.5;opacity:.85}
.lake-label{font-family:"Songti SC","KaiTi",serif;fill:#6f9cc9;opacity:.6;font-size:11px;text-anchor:middle}
.grass{stroke:#5a7a52;stroke-width:1.6;fill:none;opacity:.55;stroke-linecap:round}
.dune{stroke:#8a7340;stroke-width:1.8;fill:none;opacity:.5;stroke-linecap:round}
.snowmtn{stroke:#7a8aa8;stroke-width:2;fill:#243048;opacity:.85;stroke-linejoin:round}
.snowcap{fill:#c8d4e8;opacity:.8}
.tree-c{fill:#2e4a34;stroke:#4a6a50;stroke-width:1;opacity:.8}
.tree-t{stroke:#4a5a40;stroke-width:1.6;opacity:.7}
.river-w{fill:none;stroke:#1d3a5c;stroke-width:13;opacity:.85;stroke-linecap:round}
.river-c{fill:none;stroke:#3a679a;stroke-width:3.5;opacity:.6;stroke-linecap:round}
.river-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#6f9cc9;opacity:.7;font-size:17px;letter-spacing:5px}
.sea{fill:url(#seaGrad);stroke:#3a577c;stroke-width:2.5;opacity:.97}
.wave{fill:none;stroke:#4a6f96;stroke-width:1.8;opacity:.4;stroke-linecap:round}
.sea-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#5d83ad;opacity:.55;letter-spacing:6px}
.region{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#a8bcd8;opacity:.10;font-weight:700;letter-spacing:10px;text-anchor:middle;pointer-events:none}
.mtn{stroke:#55678a;stroke-width:2.2;fill:#1b2740;opacity:.75;stroke-linejoin:round}
.mtn2{stroke:#55678a;stroke-width:1.6;fill:#16203466;opacity:.55;stroke-linejoin:round}
.frame{fill:none;stroke:#33425f;opacity:.8}
.compass{opacity:.6}
g.city{cursor:pointer}
g.city .body{stroke:#0a0e15;stroke-width:2.5;filter:drop-shadow(0 3px 4px #000a)}
g.city .capring{fill:none;stroke:#ffd966;stroke-width:1.8;stroke-dasharray:4 3;opacity:.9}
g.city .fch{font-size:21px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0008;stroke-width:3}
g.city .name{font-size:17px;font-weight:700;fill:#e8e2d0;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b1018;stroke-width:4}
g.city .name.cap{fill:#ffd966}
g.city .troops{font-size:13.5px;fill:#aebdd2;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b1018;stroke-width:3.5}
g.city .ticon{font-size:14px;text-anchor:middle;pointer-events:none;opacity:.95}
g.city .ring{fill:none;display:none;pointer-events:none}
g.city.sel .ring{display:block;stroke:#fff;stroke-width:3}
g.city.atk .ring{display:block;stroke:#ff5f5f;stroke-width:4;animation:pulse 1.1s infinite}
g.city.mov .ring{display:block;stroke:#5fe88a;stroke-width:3;stroke-dasharray:7 7;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.25}}
.flash{animation:cityflash .5s 2}
@keyframes cityflash{50%{opacity:.2}}

/* ===== 城市面板 ===== */
#panel{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  background:rgba(19,27,42,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid #2c3a55;border-radius:20px 20px 0 0;
  max-height:52dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(108%);visibility:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.25,1),visibility 0s .28s;
}
#panel.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.25,1)}
@media (min-width:900px){
  #panel{
    left:auto;right:14px;top:66px;bottom:16px;width:368px;max-height:none;
    border:1px solid #2c3a55;border-radius:16px;transform:translateX(118%);
  }
  #panel.show{transform:none}
}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.p-head .cname{font-size:23px;font-weight:800;letter-spacing:2px}
.p-head .ftag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid;font-weight:700}
.p-head .x{margin-left:auto}
.flavor{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:13px;color:#b9a978;opacity:.85;margin-bottom:10px;letter-spacing:1px}
.statrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.stat{font-size:13px;background:#16213399;border:1px solid #2a3650;border-radius:9px;padding:5px 9px}
.stat.trait{border-color:#6a5a2a;color:#d9c08a;background:#241e1266}
.gens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.gchip{font-size:12.5px;background:#2a2338;border:1px solid #6a5a8a;border-radius:999px;padding:4px 10px;color:#d9c8f2}
.sec-title{font-size:12px;opacity:.55;margin:10px 0 7px;letter-spacing:2px}
.actgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;border-radius:12px;
  padding:10px 6px;font-size:14px;cursor:pointer;touch-action:manipulation;min-height:46px;
}
.btn small{font-size:11px;opacity:.6}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.wide{flex-direction:row;justify-content:space-between;padding:12px 14px;width:100%;margin-top:8px}
.btn.atk{border-color:#a04040;background:#3a1d22}
.btn.mov{border-color:#3f7a52;background:#1d3526}
.btn.gold{border-color:#caa64b;background:#332a14}

/* ===== 弹窗 ===== */
#modal-root{
  position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:18px;
}
#modal-root.show{display:flex}
.modal{
  background:#16213a;border:1px solid #33425f;border-radius:18px;width:100%;max-width:430px;
  max-height:82dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;
  animation:mIn .22s cubic-bezier(.2,.8,.25,1);
}
@keyframes mIn{from{transform:scale(.92) translateY(14px);opacity:0}}
.modal h3{margin:0 0 12px;font-size:19px;letter-spacing:2px;color:#e8c96a}
.modal .row{display:flex;gap:10px;margin-top:14px}
.modal .row .btn{flex:1;flex-direction:row;min-height:48px;font-size:16px}
.modal .btn.primary{background:linear-gradient(#d9b455,#9a7a28);border-color:#e8c96a;color:#221a06;font-weight:700}
input[type=range]{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;margin:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:#2a3650}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-11px;
  background:linear-gradient(#e8c96a,#a07f2c);border:2px solid #fff3;box-shadow:0 2px 8px #000a;
}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:#2a3650}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#d9b455;border:2px solid #fff3}
.qbtns{display:flex;gap:8px}
.qbtns button{flex:1;padding:7px 0;border-radius:9px;border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;font-size:13px;cursor:pointer;touch-action:manipulation}
.gchk{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;background:#2a2338;border:1px solid #6a5a8a;
  border-radius:999px;padding:6px 12px;margin:3px 4px 3px 0;color:#d9c8f2;cursor:pointer;
}
.gchk input{width:17px;height:17px;accent-color:#caa64b}
.est{margin-top:12px;padding:10px 12px;border-radius:10px;background:#101828;border:1px solid #2a3650;font-size:14px;text-align:center}
.battle-stage{text-align:center;padding:18px 0;font-size:38px;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}
.b-result{text-align:center;font-size:23px;font-weight:800;margin:10px 0;letter-spacing:2px}
.b-result.win{color:#6fe89a}.b-result.lose{color:#ff7a7a}
.b-side{display:flex;justify-content:space-between;background:#101828;border:1px solid #2a3650;border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px}
.duel{
  margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.8;
  background:#2a1d10;border:1px solid #8a6f3a;color:#e8cf9a;
}
.loglist{font-size:13.5px;line-height:1.9;max-height:56dvh;overflow-y:auto}
.loglist div{border-bottom:1px dashed #2a3650;padding:3px 0}
.helpbox{font-size:14px;line-height:1.9}
.helpbox b{color:#e8c96a}
.hist-item{
  background:linear-gradient(#262013,#1e1a10);border:1px solid #8a6f3a;border-radius:12px;
  padding:12px 14px;margin-bottom:10px;
}
.hist-title{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:17px;color:#e8c96a;letter-spacing:2px;margin-bottom:6px}
.g-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #2a3650;font-size:14px}
.g-row .g-info{flex:1;min-width:0}
.g-row .g-stats{font-size:12.5px;opacity:.85;margin-top:2px}
g.city.small .fch{font-size:14px}
g.city.small .name{font-size:14px}
g.city.small .troops{font-size:11px}
g.city.small .ticon{font-size:12px}
.hist-text{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:14.5px;line-height:2;color:#d9cba8}

/* ===== 提示 ===== */
#toasts{
  position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw;
}
.toast{
  background:rgba(25,35,55,.95);border:1px solid #3f5277;border-radius:999px;padding:9px 18px;
  font-size:14px;box-shadow:0 4px 16px #000a;animation:tIn .25s,tOut .4s 2.8s forwards;white-space:nowrap;
  max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}}
@keyframes tOut{to{transform:translateY(-8px);opacity:0}}
#turn-overlay{
  position:absolute;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,14,.55);font-size:20px;letter-spacing:5px;color:#e8c96a;backdrop-filter:blur(2px);
}
#turn-overlay.show{display:flex}
#turn-overlay .inner{animation:breathe 1.2s infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>

<!-- 主菜单 -->
<div class="screen show" id="screen-menu">
  <h1 class="serif">三国 · 烽火天下</h1>
  <div class="sub serif">运 筹 帷 幄 &nbsp; 一 统 河 山</div>
  <button class="menu-btn primary" id="btn-continue" style="display:none">▶ 继续征程</button>
  <button class="menu-btn" id="btn-new">⚔️ 新的霸业</button>
  <button class="menu-btn" id="btn-help0">📜 游戏说明</button>
  <div style="font-size:11px;opacity:.35;margin-top:20px">单机离线 · 进度自动保存于本机</div>
</div>

<!-- 选择势力 -->
<div class="screen" id="screen-setup">
  <h2 class="serif">择 主 而 事</h2>
  <div style="font-size:12px;opacity:.5;margin-bottom:6px">公元 200 年，群雄并起，天下三分之势未成</div>
  <div id="fact-cards"></div>
  <div class="setup-row" style="margin-top:8px">
    <span>难度</span>
    <div class="seg" id="diff-seg">
      <button data-d="0.75">简单</button><button data-d="1" class="sel">普通</button><button data-d="1.35">困难</button>
    </div>
  </div>
  <button class="menu-btn primary" id="btn-start" style="margin-top:8px">出 师 ！</button>
  <button class="menu-btn" id="btn-back" style="padding:10px;font-size:14px;width:auto;min-width:140px">返回</button>
</div>

<!-- 游戏 -->
<div class="screen" id="screen-game">
  <div id="map-wrap"><svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="topbar">
    <span class="res" id="tb-fact">蜀</span>
    <span class="res" id="tb-date">200年 春</span>
    <span class="res" id="tb-gold">💰 0</span>
    <span class="res" id="tb-food">🌾 0</span>
    <span class="res" id="tb-city">🏯 0</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-gens" title="武将府">👤</button>
    <button class="icon-btn" id="btn-log" title="战报日志">📜</button>
    <button class="icon-btn" id="btn-help" title="说明">❓</button>
    <button class="icon-btn" id="btn-gmenu" title="菜单">☰</button>
  </div>
  <button id="btn-endturn">结束回合 ▶</button>
  <div id="panel"></div>
  <div id="turn-overlay"><div class="inner">诸 侯 行 动 中 …</div></div>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =================== 工具 =================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtT=n=>n>=10000?(Math.round(n/1000)/10)+'万':''+n;
const fmtG=n=>Math.floor(n).toLocaleString('en-US');
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SAVE_KEY='sgbh_save_v4';

/* =================== 音效 =================== */
const Sound={
  ctx:null,on:store.get('sgbh_sound')!=='0',
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,t,dur,type='sine',vol=.18){
    if(!this.on||!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(this.ctx.destination);
    const now=this.ctx.currentTime+t;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.012);
    g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.start(now);o.stop(now+dur+.05);
  },
  play(k){
    if(!this.on||!this.ctx)return;
    switch(k){
      case 'tap':this.tone(660,0,.06,'triangle',.1);break;
      case 'coin':this.tone(880,0,.09,'triangle');this.tone(1320,.07,.12,'triangle');break;
      case 'march':this.tone(220,0,.12,'square',.08);this.tone(180,.12,.14,'square',.08);break;
      case 'battle':this.tone(110,0,.25,'sawtooth',.14);this.tone(90,.18,.3,'sawtooth',.14);break;
      case 'duel':this.tone(1100,0,.07,'square',.1);this.tone(1400,.09,.07,'square',.1);this.tone(900,.18,.12,'square',.1);break;

/* =================== 游戏状态 =================== */
let state=null,selected=-1,busy=false;

function newGame(playerFid,diff){
  state={
    v:4,player:playerFid,diff:diff,turn:1,year:200,season:0,won:false,fired:[],
    factions:{},log:[],
    cities:CITY_DEFS.map(d=>({name:d[0],x:d[1],y:d[2],owner:d[3],troops:d[4],
      farm:d[5],comm:d[6],wall:d[7],cap:d[8],trait:d[9],tag:d[10],tired:0,devUsed:false,recUsed:false})),
    generals:GEN_DEFS.map((g,i)=>({id:i,name:g[0],war:g[1],wu:g[2],fid:g[3],city:g[4],title:null})),
    pool:POOL_DEFS.map((g,i)=>({id:100+i,name:g[0],war:g[1],wu:g[2]})),
    rkLast:0,
  };
  MAJORS.forEach(f=>{state.factions[f]={gold:2000,food:2500,alive:true}});
  addLog(`${FACTS[playerFid].leader}举义兵于${capOf(playerFid)}，大业自此始！`);
}
function capOf(fid){const c=state.cities.find(c=>c.owner===fid&&c.cap);return c?c.name:'';}
function C(i){return state.cities[i]}
function F(fid){return state.factions[fid]}
function cityIdsOf(fid){return state.cities.map((c,i)=>c.owner===fid?i:-1).filter(i=>i>=0)}
function generalsIn(cid){return state.generals.filter(g=>g.city===cid&&g.fid===C(cid).owner)}
function bestGen(gens){return gens.reduce((a,b)=>effWar(a)>effWar(b)?a:b)}
function bestWuGen(gens){return gens.reduce((a,b)=>a.wu>b.wu?a:b)}
function armyMult(gens){
  if(!gens.length)return 1;
  const best=Math.max(...gens.map(g=>effWar(g)));
  return 1+(best-60)/150+0.02*Math.min(gens.length-1,3);
}
function leadName(gens){return gens.length?bestGen(gens).name:'无'}
function maxLv(c,kind){return kind==='wall'?6:(c.trait==='pass'?3:10)}
function recruitMult(c){return c.trait==='horse'?0.75:c.trait==='wild'?0.65:1}
function dateStr(){return `${state.year}年 ${SEASONS[state.season]}`}
function addLog(msg){state.log.push(`【${dateStr()}】${msg}`);if(state.log.length>300)state.log.shift()}

function save(){
  if(!store.set(SAVE_KEY,JSON.stringify(state))&&!save.warned){
    save.warned=true;toast('⚠️ 此环境无法持久存档，关闭页面进度将丢失');
  }
}
function loadSave(){
  const s=store.get(SAVE_KEY);
  if(!s)return false;
  try{const o=JSON.parse(s);if(o&&o.v===4&&o.cities&&o.cities.length===CITY_DEFS.length){state=o;return true}}catch(e){}
  return false;
}

function renderMap(){
  const myFid=state.player;
  state.cities.forEach((c,i)=>{
    const g=svg.querySelector(`g.city[data-id="${i}"]`);
    if(!g)return;
    g.querySelector('.body').setAttribute('fill',FACTS[c.owner].color);
    g.querySelector('.fch').textContent=FACTS[c.owner].name;
    g.querySelector('.troops').textContent=fmtT(c.troops);
    g.classList.remove('sel','atk','mov');
  });
  if(selected>=0){
    const sc=C(selected);
    svg.querySelector(`g.city[data-id="${selected}"]`).classList.add('sel');
    if(sc.owner===myFid){
      ADJ[selected].forEach(n=>{
        const cls=C(n).owner===myFid?'mov':'atk';
        svg.querySelector(`g.city[data-id="${n}"]`).classList.add(cls);
      });
    }else{
      ADJ[selected].forEach(n=>{
        if(C(n).owner===myFid)svg.querySelector(`g.city[data-id="${n}"]`).classList.add('mov');
      });
    }
  }
}
function flashCity(i){

    setTimeout(()=>g.classList.remove('flash'),1100);}

function animateMarch(from,to,color,cb){
  const layer=$('#fx-layer');
  const a=C(from),b=C(to);
  const dot=svgEl('circle',{r:11,fill:color,stroke:'#fff',
    'stroke-width':2.5,filter:'drop-shadow(0 0 6px '+color+')'});
  layer.appendChild(dot);
  Sound.play('march');
  const t0=performance.now(),dur=620;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    dot.setAttribute('cx',a.x+(b.x-a.x)*e);
    dot.setAttribute('cy',a.y+(b.y-a.y)*e-Math.sin(p*Math.PI)*18);
    if(p<1)requestAnimationFrame(step);else{dot.remove();cb&&cb();}
  })(t0);
}

      <span>⚔️ 征兵${rm<1?' <small style="color:#9ae6a8">'+t.icon+'优惠</small>':''}</span><small>${c.recUsed?'本回合已征募':`${(RG*rm).toFixed(2)}金+${(RF*rm).toFixed(2)}粮/人`}</small>

    <div class="sec-title">出 兵（可战 ${fmtT(fresh)}）${state.season===3?'<span style="color:#7fb3e8">❄️ 冬季出征 -10%</span>':''}</div>`;

      html+=`<div class="sec-title">可由以下城池发兵</div>`;

$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||busy)return;
  const act=b.dataset.act;
  Sound.play('tap');
  if(act==='close')return deselect();
  if(act==='recruit')return openRecruitModal(selected);
  if(act.startsWith('dev-'))return doDev(selected,act.slice(4));
  if(act.startsWith('army:'))return openArmyModal(selected,+act.slice(5));
  if(act.startsWith('armyfrom:'))return openArmyModal(+act.slice(9),selected);
});

/* =================== 弹窗 =================== */
const mroot=$('#modal-root');
function modal(html,opts={}){
  mroot.innerHTML=`<div class="modal">${html}</div>`;
  mroot.classList.add('show');
  mroot.onclick=e=>{if(e.target===mroot&&!opts.lock)closeModal()};
  return mroot.firstElementChild;
}
function closeModal(){mroot.classList.remove('show');mroot.innerHTML='';}

/* ---- 征兵 ---- */

/* ---- 内政 ---- */
function doDev(cid,kind){
  const c=C(cid),f=F(state.player);
  if(c.devUsed)return;
  const lvNow=kind==='farm'?c.farm:kind==='comm'?c.comm:c.wall;
  if(lvNow>=maxLv(c,kind))return;
  let cost,label;
  if(kind==='farm'){cost=devCost(c.farm);label='农业';}
  else if(kind==='comm'){cost=devCost(c.comm);label='商业';}
  else{cost=wallCost(c.wall);label='城防';}
  if(f.gold<cost){toast('💰 金钱不足');return;}
  f.gold-=cost;c.devUsed=true;
  if(kind==='farm')c.farm++;else if(kind==='comm')c.comm++;else c.wall++;
  const lv=kind==='farm'?c.farm:kind==='comm'?c.comm:c.wall;
  addLog(`${c.name} ${label}提升至 ${lv} 级`);
  Sound.play('coin');
  toast(`✨ ${c.name} ${label} → Lv.${lv}`);
  renderAll();save();
}

/* ---- 战力计算（出征/守城共用，预估与实战一致） ---- */
function atkPowerOf(commit,gens,fromCid,toCid){
  let m=armyMult(gens);
  const t=C(fromCid).trait;
  if(t==='horse'||t==='port')m*=1.08;
  if(state.season===3)m*=0.9; // 冬季攻伐不利
  if(toCid!==undefined){      // 山河之险
    const et=edgeType(fromCid,toCid);
    if(et==='r'&&t!=='port')m*=0.85;
    if(et==='m')m*=0.88;
  }
  return commit*m;
}
function terrainNote(fromCid,toCid){
  const et=edgeType(fromCid,toCid);
  if(et==='r')return C(fromCid).trait==='port'?'⛵ 舟师渡江，如履平地':'🌊 渡江强攻 -15%';
  if(et==='m')return '⛰ 山道险阻 -12%';
  return '';
}
function defPowerOf(cid){
  const d=C(cid);
  let m=armyMult(generalsIn(cid))*(1+d.wall*0.06)*1.12;
  if(d.trait==='fort')m*=1.15;
  if(d.trait==='pass')m*=1.3; // 雄关天险
  if(MAJORS.includes(d.owner)&&cityIdsOf(d.owner).length<=3)m*=1.1; // 哀兵：势力垂危时同仇敌忾
  return Math.max(1,d.troops)*m;
}

    :'<span class="dim" style="font-size:12px">本城无武将随行</span>';

    <h3>${hostile?'⚔️ 进攻':'🚚 调动'} · ${A.name} → ${B.name}</h3>
    ${hostile?`<div class="b-side"><span>守军 ${FACTS[B.owner].name}·${fmtT(B.troops)}</span><span>城防${B.wall}${B.trait==='fort'?'·🛡️雄关':''} · 守将 ${leadName(dGens)}</span></div>`:''}
    <div style="text-align:center;font-size:30px;font-weight:800;margin:8px 0;color:#e8c96a"><span id="am-n"></span> <span style="font-size:15px">兵</span></div>
    <input type="range" id="am-slider" min="500" max="${fresh}" step="100" value="${def}">
    <div class="qbtns"><button data-q=".25">25%</button><button data-q=".5">50%</button><button data-q=".75">75%</button><button data-q="1">全军</button></div>
    <div style="margin-top:10px"><div class="sec-title" style="margin-top:0">随行武将</div>${gHtml}</div>
    <div class="est" id="am-est"></div>
    <div class="row"><button class="btn" data-x="cancel">取消</button>
    <button class="btn primary" data-x="go">${hostile?'出 征 ！':'调 动'}</button></div>
  `);
  const sl=m.querySelector('#am-slider');

      if(r>1.45){txt='🔥 胜算极大';col='#6fe89a'}
      else if(r>1.08){txt='✅ 略占优势';col='#a8e06f'}
      else if(r>0.85){txt='⚖️ 势均力敌，胜负难料';col='#e8c96a'}
      else{txt='☠️ 凶多吉少，不宜强攻';col='#ff7a7a'}
      const tn=terrainNote(from,to);
      est.innerHTML=`我军战力 <b>${fmtG(ap)}</b> ⚡ 敌军战力 <b>${fmtG(dp)}</b><div style="color:${col};margin-top:4px;font-weight:700">${txt}</div>
      <div class="dim" style="font-size:12px;margin-top:3px">${tn?tn+' · ':''}${state.season===3?'❄️ 冬季出征 -10% · ':''}双方有将则可能阵前单挑 · 出兵后 ${A.name} 留守 ${fmtT(A.troops-n)}</div>`;
    }else{
      est.innerHTML=`调动后 ${A.name} 留守 <b>${fmtT(A.troops-n)}</b>，${B.name} 兵力 <b>${fmtT(B.troops+n)}</b><div class="dim" style="font-size:12px;margin-top:3px">移防之兵需休整，下回合方可出战</div>`;

function deselectKeepPanel(){selected=-1;$('#panel').classList.remove('show');document.body.classList.remove('panel-open');renderMap();}

function doTransfer(from,to,n,genIds){
  const A=C(from),B=C(to);
  A.troops-=n;A.tired=Math.min(A.tired,A.troops);
  B.troops=Math.min(TROOP_CAP,B.troops+n);B.tired+=n;
  genIds.forEach(id=>{const g=state.generals.find(g=>g.id===id);if(g)g.city=to;});
  addLog(`${A.name} 移兵 ${n} 至 ${B.name}`);
}

/* =================== 战斗 =================== */
function fleeGenerals(cid){
  const owner=C(cid).owner;
  const others=cityIdsOf(owner).filter(i=>i!==cid);
  state.generals.filter(g=>g.fid===owner&&g.city===cid).forEach(g=>{
    if(others.length)g.city=others[ri(0,others.length-1)];
    else{g.fid='pool';g.city=-1;}
  });
}
function checkElimination(fid){
  if(!MAJORS.includes(fid))return;
  if(cityIdsOf(fid).length===0&&F(fid).alive){
    F(fid).alive=false;
    state.generals.filter(g=>g.fid===fid).forEach(g=>{g.fid='pool';g.city=-1;});
    const msg=`💀 ${FACTS[fid].name}国覆灭，${FACTS[fid].leader}败走！`;
    addLog(msg);toast(msg);
  }
}
function maybeRecruitPool(fid,cid){
  if(!state.pool.length||Math.random()>0.5)return null;
  const g=state.pool.splice(ri(0,state.pool.length-1),1)[0];
  state.generals.push({id:g.id,name:g.name,war:g.war,wu:g.wu,fid:fid,city:cid,title:null});
  return g;
}
const DUEL_WIN=['{w} 大喝一声，刀光闪处 {l} 拨马便走，{s}军士气大振！',
  '两马相交三十余合，{w} 卖个破绽，一击将 {l} 挑于马下，{s}军欢声雷动！',
  '{w} 弓开如满月，一箭射落 {l} 盔缨，{l} 胆寒而退，{s}军威势更盛！'];
function doBattle(from,to,commit,genIds){
  const A=C(from),D=C(to);
  const attFid=A.owner,defFid=D.owner;
  const ag=genIds.map(id=>state.generals.find(g=>g.id===id)).filter(Boolean);
  const dg=generalsIn(to);
  // 阵前单挑
  let duel=null,duelA=1,duelD=1;
  if(ag.length&&dg.length&&Math.random()<0.35){
    const a=bestWuGen(ag),d=bestWuGen(dg);
    const aWin=a.wu+rnd(0,30)>d.wu+rnd(0,30);
    if(aWin)a.wu=Math.min(100,a.wu+1);else d.wu=Math.min(100,d.wu+1);
    duel={a:a.name,d:d.name,aWin,
      text:DUEL_WIN[ri(0,DUEL_WIN.length-1)]
        .replaceAll('{w}',aWin?a.name:d.name).replaceAll('{l}',aWin?d.name:a.name)
        .replaceAll('{s}',aWin?'攻':'守')};
    if(aWin)duelA=1.15;else duelD=1.15;
  }
  const atkP=atkPowerOf(commit,ag,from,to)*duelA*rnd(0.88,1.12);
  const defP=defPowerOf(to)*duelD*rnd(0.88,1.12);
  const tot=atkP+defP;
  const won=atkP>defP;
  let attLoss=Math.min(commit,Math.round(commit*(defP/tot)*0.9));
  let defLoss;
  A.troops-=commit;A.tired=Math.min(A.tired,A.troops);
  let joined=null;
  if(won){
    defLoss=D.troops;
    const surv=commit-attLoss;
    fleeGenerals(to);
    const prevOwner=D.owner;
    D.owner=attFid;D.troops=surv;D.tired=surv;
    D.wall=Math.max(0,D.wall-1);D.devUsed=false;D.recUsed=false;
    ag.forEach(g=>g.city=to);
    if(ag.length){const lg=bestGen(ag);lg.war=Math.min(99,lg.war+1);} // 胜将扬名
    if(prevOwner==='neutral')joined=maybeRecruitPool(attFid,to);
    addLog(`${FACTS[attFid].name}军${leadName(ag)!=='无'?'('+leadName(ag)+')':''} 攻克 ${D.name}！歼敌 ${defLoss}，自损 ${attLoss}`);
    checkElimination(prevOwner);
  }else{
    defLoss=Math.min(D.troops,Math.round(D.troops*(atkP/tot)*0.9));
    const surv=commit-attLoss;
    A.troops+=surv;A.tired+=surv;
    D.troops-=defLoss;
    if(dg.length){const lg=bestGen(dg);lg.war=Math.min(99,lg.war+1);}
    let wallNote='';
    if(atkP>defP*0.6&&D.wall>0){D.wall--;wallNote=`，${D.name} 城垣受损`;} // 攻城锤：强攻虽败亦损城防
    addLog(`${FACTS[attFid].name}军强攻 ${D.name} 受挫，损兵 ${attLoss}，守军折损 ${defLoss}${wallNote}`);
  }
  flashCity(to);
  return {from,to,attFid,defFid,commit,won,attLoss,defLoss,joined,duel,
    attLead:leadName(ag),defLead:leadName(dg),
    involvesPlayer:attFid===state.player||defFid===state.player};
}
function showBattleModal(r){
  const A=C(r.from),D=C(r.to);
  const m=modal(`
    <h3>⚔️ ${A.name} → ${D.name} 之战</h3>
    <div class="b-side"><span style="color:${FACTS[r.attFid].color}">攻 ${FACTS[r.attFid].name}军 · ${r.attLead}</span><span>${r.commit.toLocaleString()} 兵</span></div>
    <div class="b-side"><span style="color:${FACTS[r.defFid].color}">守 ${FACTS[r.defFid].name}军 · ${r.defLead}</span><span>${(r.defLoss+(r.won?0:C(r.to).troops)).toLocaleString()} 兵</span></div>
    <div id="bt-stage"><div class="battle-stage">⚔️</div>
    <div style="text-align:center" class="dim">两军交锋，杀声震天…</div></div>
  `,{lock:true});
  Sound.play('battle');
  if(r.duel)setTimeout(()=>Sound.play('duel'),400);
  setTimeout(()=>{
    const ok=r.won;
    Sound.play(ok?'win':'lose');
    m.querySelector('#bt-stage').innerHTML=`
      ${r.duel?`<div class="duel">⚡ 阵前单挑：<b>${r.duel.a}</b> 对阵 <b>${r.duel.d}</b><br>${r.duel.text}</div>`:''}
      <div class="b-result ${ok?'win':'lose'}">${ok?'🎉 攻克 '+D.name+' ！':'💥 攻势受挫，败退而归'}</div>
      <div style="text-align:center;font-size:14px;line-height:2">
        我军伤亡 <b style="color:#ff9a9a">${r.attLoss.toLocaleString()}</b>　敌军${ok?'全灭':'伤亡'} <b style="color:#9ad0ff">${r.defLoss.toLocaleString()}</b>
        ${ok?`<br>${fmtT(r.commit-r.attLoss)} 大军进驻 ${D.name}（需休整）`:''}

/* =================== AI =================== */
function aiConfer(fid){
  const f=F(fid),rk=rankIdxOf(fid);
  const cand=state.generals.filter(g=>g.fid===fid&&!g.title).sort((a,b)=>b.war-a.war)[0];
  if(!cand)return;
  const avail=TITLES.filter(t=>t.req<=rk&&f.gold>t.cost*2.5&&countTitle(fid,t.id)<t.max)
    .sort((a,b)=>b.bonus-a.bonus)[0];
  if(avail){f.gold-=avail.cost;cand.title=avail.id;}
}
function aiTurn(fid,reports){
  const f=F(fid);
  if(!f.alive)return;
  const p=PERSONA[fid];
  aiConfer(fid);
  const myIds=cityIdsOf(fid);
  for(const cid of myIds){
    const c=C(cid);
    if(c.owner!==fid)continue;
    const hostileN=ADJ[cid].filter(n=>C(n).owner!==fid);
    const isBorder=hostileN.length>0;
    // 内政
    if(!c.devUsed){
      const mF=Math.min(9,maxLv(c,'farm')),mC=Math.min(9,maxLv(c,'comm'));
      if(isBorder&&c.wall<p.wallMax&&f.gold>wallCost(c.wall)+600){f.gold-=wallCost(c.wall);c.wall++;c.devUsed=true;}
      else if(c.farm<=c.comm&&c.farm<mF&&f.gold>devCost(c.farm)+500){f.gold-=devCost(c.farm);c.farm++;c.devUsed=true;}
      else if(c.comm<mC&&f.gold>devCost(c.comm)+500){f.gold-=devCost(c.comm);c.comm++;c.devUsed=true;}
    }
    // 征兵：边境城打不动邻敌时蓄力攻坚
    let recTarget=p.rec;
    if(isBorder){
      const weakest=Math.min(...hostileN.map(n=>defPowerOf(n)));
      const myP=atkPowerOf(c.troops,generalsIn(cid),cid);
      if(weakest*1.05>myP)recTarget=Math.min(42000,p.rec+20000);
    }
    if(!c.recUsed&&isBorder&&c.troops<recTarget){
      const rm=recruitMult(c);
      const n=Math.min(RECRUIT_CAP,TROOP_CAP-c.troops,Math.floor(f.gold*0.6/(RG*rm)/100)*100,Math.floor(f.food*0.4/(RF*rm)/100)*100);
      if(n>=1000){f.gold-=n*RG*rm;f.food-=n*RF*rm;c.troops+=n;c.tired+=n;c.recUsed=true;}
    }
    // 进攻：兵力屯积过多则"不得不发"，城池过半则"势如破竹"（但不打必败之仗）
    const fresh=c.troops-c.tired;
    if(fresh>4000){
      let thr=p.atk;
      if(fresh>p.rec*1.2)thr=p.atk*0.8;   // 压力阀：大军已集
      if(myIds.length>=15)thr*=0.62;      // 势如破竹
      else if(myIds.length>=12)thr*=0.8;
      thr=Math.max(myIds.length>=15?1.0:1.05,thr);
      const ratio=fresh>p.rec*1.2?0.9:0.85;
      let best=-1,bestScore=0;
      for(const n of hostileN){
        const t=C(n);
        const need=defPowerOf(n)*thr+1000;
        const commit=Math.floor(fresh*ratio);
        const myP=atkPowerOf(commit,generalsIn(cid),cid,n);
        if(myP>need){
          const score=(myP/Math.max(1,need))*(t.owner==='neutral'?p.neu:1);
          if(score>bestScore){bestScore=score;best=n;}
        }
      }
      if(best>=0){
        const commit=Math.floor(fresh*ratio);
        const gids=generalsIn(cid).map(g=>g.id);
        const r=doBattle(cid,best,commit,gids);
        reports.push(r);
        continue;
      }
    }
    // 向前线增援
    if(!isBorder&&c.troops>8000){
      const friends=ADJ[cid].filter(n=>C(n).owner===fid);
      const front=friends.find(n=>ADJ[n].some(m=>C(m).owner!==fid))??friends[0];
      if(front!==undefined){
        const n=Math.floor((c.troops-4000)/100)*100;
        if(n>=1000){
          c.troops-=n;c.tired=Math.min(c.tired,c.troops);
          const t=C(front);t.troops=Math.min(TROOP_CAP,t.troops+n);t.tired+=n;
          state.generals.filter(g=>g.fid===fid&&g.city===cid).slice(1).forEach(g=>g.city=front);
        }
      }
    }
  }
}
function neutralRegen(){
  state.cities.forEach(c=>{
    if(c.owner==='neutral'&&c.troops<14000)c.troops=Math.min(14000,c.troops+250);
  });
}
function incomeAll(){
  MAJORS.forEach(fid=>{
    const f=F(fid);
    if(!f.alive)return;
    const mult=fid===state.player?1:state.diff;
    let gold=0,food=0,troops=0;
    cityIdsOf(fid).forEach(i=>{
      const c=C(i);
      gold+=(GOLD_BASE+c.comm*GOLD_PER_COMM)*(c.trait==='trade'?1.4:1);
      food+=c.farm*FOOD_PER_FARM*(state.season===2?2:1)*(c.trait==='gran'?1.4:1);
      troops+=c.troops;
    });
    f.gold+=Math.round(gold*mult*(1+RANKS[rankIdxOf(fid)].inc));
    f.food+=Math.round(food*mult-troops*UPKEEP);
    if(f.food<0){
      cityIdsOf(fid).forEach(i=>{const c=C(i);const d=Math.floor(c.troops*0.08);c.troops-=d;c.tired=Math.min(c.tired,c.troops);});
      f.food=0;
      if(fid===state.player){toast('⚠️ 军粮告罄，士卒逃散！');addLog('军粮不足，各城士卒逃散 8%');}
    }
  });
}
const EVENTS=[
  {t:'🌾 风调雨顺，{c} 喜获丰收（+400 粮）',f:(f,c)=>f.food+=400},
  {t:'💰 西域商队途经 {c}，贸易获利（+400 金）',f:(f,c)=>f.gold+=400},
  {t:'🏚 {c} 遭遇旱灾，粮草受损（-300 粮）',f:(f,c)=>f.food=Math.max(0,f.food-300)},

  {t:'🚩 流民来投，{c} 募得乡勇 1200',f:(f,c)=>{c.troops=Math.min(TROOP_CAP,c.troops+1200);c.tired+=1200;}},
  {t:'⚒ 能工巧匠献策，{c} 城防加固',f:(f,c)=>{if(c.wall<6)c.wall++;}},

function randomEvent(){
  if(Math.random()>0.3)return;

  if(!ids.length)return;

function advanceTime(){
  state.turn++;
  state.season++;
  if(state.season>3){state.season=0;state.year++;}
  state.cities.forEach(c=>{c.tired=0;c.devUsed=false;c.recUsed=false;});
}
function checkHistory(){
  const fired=[];
  HISTORY.forEach(h=>{
    if(state.fired.includes(h.id))return;
    if(state.year<h.y||(state.year===h.y&&state.season<h.s))return;
    state.fired.push(h.id);
    if(!h.cond())return;
    let extra='';
    try{extra=h.fx()||''}catch(e){}
    fired.push({title:h.title,text:h.text+(extra?'<br>'+extra:''),year:h.y});
    addLog(`〔史〕${h.title}`);
  });
  return fired;
}

/* =================== 回合 =================== */
function runSteps(steps){
  const next=()=>{const s=steps.shift();if(s)s(next);};
  next();
}
function endTurn(){
  if(busy)return;
  busy=true;
  deselect();closeModal();
  $('#turn-overlay').classList.add('show');
  setTimeout(()=>{
    const reports=[];
    MAJORS.filter(f=>f!==state.player&&F(f).alive).forEach(fid=>aiTurn(fid,reports));
    neutralRegen();
    incomeAll();
    advanceTime();
    randomEvent();
    const hist=checkHistory();
    save();
    renderAll();
    $('#turn-overlay').classList.remove('show');
    Sound.play('turn');
    toast(`${SEASON_EMO[state.season]} ${dateStr()} · 第 ${state.turn} 回合`);
    const steps=[];
    if(hist.length)steps.push(cb=>showHistoryModal(hist,cb));
    const mine=reports.filter(r=>r.involvesPlayer);
    if(mine.length)steps.push(cb=>showWarReport(mine,cb));
    if(Math.random()<0.25)steps.push(cb=>showChoiceEvent(cb));
    steps.push(cb=>{checkVictory();if(cb)cb();});
    runSteps(steps);
    busy=false;
  },700);
}

function checkVictory(){
  const myCities=cityIdsOf(state.player).length;
  if(myCities===0){
    Sound.play('lose');
    modal(`<h3 style="color:#ff7a7a">💀 大势已去</h3>
      <div style="font-size:15px;line-height:2">${dateStr()}，${FACTS[state.player].leader}兵败城失，霸业成空。<br>共历 ${state.turn} 回合。胜败兵家常事，重整旗鼓再来！</div>

      .querySelector('#vd-new').onclick=()=>{store.del(SAVE_KEY);location.reload();};
    return;
  }
  // 强敌一统天下（22 城）则大势已去
  const colossus=MAJORS.find(f=>f!==state.player&&cityIdsOf(f).length>=AI_WIN);
  if(colossus){
    Sound.play('lose');
    modal(`<h3 style="color:#ff7a7a">🏯 天下易主</h3>

      <div class="row"><button class="btn primary" id="vd-new2">重 整 河 山</button></div>`,{lock:true})
      .querySelector('#vd-new2').onclick=()=>{store.del(SAVE_KEY);location.reload();};
    return;
  }
  // 强敌坐大预警
  if(!state.warnBig){
    const big=MAJORS.find(f=>f!==state.player&&cityIdsOf(f).length>=15);
    if(big){state.warnBig=true;
      const msg=`⚠️ ${FACTS[big].leader}已据十五城，天下将倾，宜早图之！`;
      toast(msg);addLog(msg);}
  }
  if(state.won)return;
  const rivalsAlive=MAJORS.filter(f=>f!==state.player&&cityIdsOf(f).length>0);
  if(myCities>=WIN_CITIES||rivalsAlive.length===0){
    state.won=true;save();
    Sound.play('win');
    modal(`<h3 style="color:#6fe89a">👑 天下归一</h3>
      <div style="font-size:15px;line-height:2.1">${dateStr()}，${FACTS[state.player].leader}${rivalsAlive.length===0?'扫平群雄':'据'+myCities+'城'}，威加海内，天下大定！<br>

      <div class="row"><button class="btn" id="vw-go">继续征伐</button><button class="btn primary" id="vw-new">再 来 一 局</button></div>`,{lock:true});
    $('#vw-go').onclick=closeModal;
    $('#vw-new').onclick=()=>{store.del(SAVE_KEY);location.reload();};
  }
}

    else if(cur&&t.bonus<=cur.bonus)why='不及现职';
    else if(!free)why='此衔已授';
    else if(f.gold<t.cost)why='金钱不足';
    return `<button class="btn wide" data-t="${t.id}" ${why?'disabled':''} style="margin-top:6px">
      <span>${t.name} <small style="color:#9ae6a8">统率 +${t.bonus}</small></span>
      <small>${why||t.cost.toLocaleString()+' 金'}</small></button>`;
  }).join('');
  const m=modal(`<h3>⚜ 授衔 · ${g.name}${cur?'（现任'+cur.name+'）':''}</h3>${opts}
    <div class="row"><button class="btn" id="cf-back">返 回</button></div>`);
  m.querySelector('#cf-back').onclick=()=>{closeModal();showRoster();};
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const t=TITLES.find(x=>x.id===b.dataset.t);
    f.gold-=t.cost;g.title=t.id;
    Sound.play('coin');
    toast(`⚜ 拜 ${g.name} 为 ${t.name}！统率 ${effWar(g)}`);
    addLog(`拜 ${g.name} 为 ${t.name}`);
    save();renderAll();closeModal();showRoster();
  });
}
function checkRank(){
  if(!state)return;
  const idx=rankIdxOf(state.player);
  if(state.rkLast===undefined)state.rkLast=idx;
  if(idx>state.rkLast){
    state.rkLast=idx;
    Sound.play('win');
    toast(`🎉 晋位「${RANKS[idx].name}」！岁入 +${Math.round(RANKS[idx].inc*100)}%，可授更高将军号`);
    addLog(`晋位 ${RANKS[idx].name}`);
  }else if(idx<state.rkLast)state.rkLast=idx;
}
function showGameMenu(){
  const m=modal(`<h3>☰ 菜单</h3>
    <button class="btn wide" id="gm-sound"><span>${Sound.on?'🔊 音效：开':'🔇 音效：关'}</span></button>
    <button class="btn wide" id="gm-help"><span>📜 玩法说明</span></button>
    <button class="btn wide atk" id="gm-restart"><span>🔄 放弃本局，重新开始</span></button>
    <div class="row"><button class="btn primary" onclick="closeModal()">返回游戏</button></div>`);
  m.querySelector('#gm-sound').onclick=e=>{
    Sound.on=!Sound.on;store.set('sgbh_sound',Sound.on?'1':'0');
    e.currentTarget.querySelector('span').textContent=Sound.on?'🔊 音效：开':'🔇 音效：关';
    Sound.play('tap');
  };
  m.querySelector('#gm-help').onclick=()=>{closeModal();showHelp();};
  m.querySelector('#gm-restart').onclick=()=>{
    closeModal();
    const c=modal(`<h3>⚠️ 确认重开？</h3><div style="font-size:14px">当前进度将被清除，不可恢复。</div>
      <div class="row"><button class="btn" id="rc-no">取消</button><button class="btn atk" id="rc-yes" style="flex-direction:row">确认重开</button></div>`);
    c.querySelector('#rc-no').onclick=closeModal;
    c.querySelector('#rc-yes').onclick=()=>{store.del(SAVE_KEY);location.reload();};
  };
}

/* =================== 地图手势 =================== */
(function(){
  const ptrs=new Map();
  let vbStart=null,ctmInv=null,startMid=null,startDist=0,anchor=null,moved=0,downT=0;
  function ptUnderStart(x,y){
    const pt=svg.createSVGPoint();pt.x=x;pt.y=y;
    return pt.matrixTransform(ctmInv);
  }
  function mid(){
    const a=[...ptrs.values()];
    if(a.length===1)return{x:a[0].x,y:a[0].y};
    return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  }
  function dist(){
    const a=[...ptrs.values()];
    if(a.length<2)return 0;
    return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
  function beginGesture(){
    vbStart={...vb};
    ctmInv=svg.getScreenCTM().inverse();
    startMid=mid();startDist=dist();
    anchor=ptUnderStart(startMid.x,startMid.y);
  }
  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size<=2)beginGesture();
    if(ptrs.size===1){moved=0;downT=performance.now();}
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    const p=ptrs.get(e.pointerId);
    moved+=Math.hypot(e.clientX-p.x,e.clientY-p.y);
    p.x=e.clientX;p.y=e.clientY;
    if(!vbStart)return;
    const cm=mid();
    let newW=vbStart.w;
    if(ptrs.size>=2&&startDist>0){
      const d=dist();
      if(d>0)newW=clamp(vbStart.w*startDist/d,230,2600);
    }
    const cmU=ptUnderStart(cm.x,cm.y);
    const k=newW/vbStart.w;
    vb.w=newW;vb.h=vbStart.h*k;
    vb.x=anchor.x-(cmU.x-vbStart.x)*k;
    vb.y=anchor.y-(cmU.y-vbStart.y)*k;
    vb.x=clamp(vb.x,-vb.w*0.7,MAPW-vb.w*0.3);
    vb.y=clamp(vb.y,-vb.h*0.7,MAPH-vb.h*0.3);
    applyVB();
  });
  function up(e){
    const was=ptrs.size;
    ptrs.delete(e.pointerId);
    if(ptrs.size>0){beginGesture();return;}
    vbStart=null;
    if(was===1&&moved<12&&performance.now()-downT<600){
      const g=e.target.closest&&e.target.closest('g.city');
      if(busy)return;
      if(g)select(+g.dataset.id);
      else deselect();
    }
  }
  svg.addEventListener('pointerup',up);
  svg.addEventListener('pointercancel',up);
  svg.addEventListener('pointerleave',e=>{if(ptrs.has(e.pointerId))up(e);});
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const k=e.deltaY>0?1.13:0.885;
    const newW=clamp(vb.w*k,230,2600);
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    const kk=newW/vb.w;
    vb.x=sp.x-(sp.x-vb.x)*kk;vb.y=sp.y-(sp.y-vb.y)*kk;
    vb.w=newW;vb.h*=kk;
    applyVB();
  },{passive:false});
})();

/* =================== 界面流程 =================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
}
let setupFid='shu',setupDiff=1;
function buildSetup(){
  const wrap=$('#fact-cards');
  wrap.innerHTML='';
  MAJORS.forEach(fid=>{
    const fd=FACTS[fid];
    const nCities=CITY_DEFS.filter(d=>d[3]===fid).length;
    const topGens=GEN_DEFS.filter(g=>g[2]===fid).sort((a,b)=>b[1]-a[1]).slice(0,3).map(g=>g[0]).join('、');
    const card=document.createElement('div');
    card.className='fcard'+(fid===setupFid?' sel':'');
    card.style.setProperty('--fc',fd.color);
    card.innerHTML=`<div class="fname" style="color:${fd.color}">${fd.name} · ${fd.leader}</div>
      <div class="fdesc">${fd.desc}</div>
      <div class="fgen">🏯 ${nCities} 城 · 👤 ${topGens}</div>
      <div class="fgen" style="color:#8fb3d9">⚜ 军略：${PERSONA[fid].label}</div>`;
    card.onclick=()=>{
      setupFid=fid;Sound.play('tap');
      wrap.querySelectorAll('.fcard').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');
    };
    wrap.appendChild(card);
  });
}
$('#diff-seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  setupDiff=+b.dataset.d;Sound.play('tap');
  $('#diff-seg').querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
});
function startGame(){
  showScreen('#screen-game');
  vb={x:-95,y:-110,w:1190,h:1085};
  buildMap();renderTopbar();
  deselect();
}
$('#btn-new').onclick=()=>{Sound.play('tap');buildSetup();showScreen('#screen-setup');};
$('#btn-back').onclick=()=>{Sound.play('tap');showScreen('#screen-menu');};
$('#btn-start').onclick=()=>{
  Sound.play('turn');
  newGame(setupFid,setupDiff);
  save();
  startGame();
  setTimeout(()=>{toast(`${SEASON_EMO[0]} ${FACTS[setupFid].leader}据${capOf(setupFid)}而起，点击城池开始经营！`)},400);
};
$('#btn-continue').onclick=()=>{
  if(loadSave()){Sound.play('turn');startGame();toast('▶ 已读取存档，继续征程');}
  else{toast('存档读取失败');$('#btn-continue').style.display='none';}
};

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css?v=9">
<title>三国·烽火天下</title>
</head>
<body>

<!-- 主菜单 -->
<div class="screen show" id="screen-menu">
  <h1 class="serif">三国 · 烽火天下</h1>
  <div class="sub serif">运 筹 帷 幄 &nbsp; 一 统 河 山</div>
  <button class="menu-btn primary" id="btn-continue" style="display:none">▶ 继续征程</button>
  <button class="menu-btn" id="btn-new">⚔️ 新的霸业</button>
  <button class="menu-btn" id="btn-help0">📜 游戏说明</button>
  <div style="font-size:11px;opacity:.35;margin-top:20px">单机离线 · 进度自动保存于本机</div>
</div>

<!-- 选择势力 -->
<div class="screen" id="screen-setup">
  <h2 class="serif">择 主 而 事</h2>
  <div style="font-size:12px;opacity:.5;margin-bottom:6px">公元 200 年，群雄并起，天下三分之势未成</div>
  <div id="fact-cards"></div>
  <div id="fact-detail"></div>
  <div id="opt-grid" style="margin-top:6px">
    <div class="setup-row">
      <span>难度</span>
      <div class="seg" id="diff-seg">
        <button data-d="0.75">简单</button><button data-d="1" class="sel">普通</button><button data-d="1.35">困难</button>
      </div>
    </div>
    <div class="setup-row">
      <span>国力</span>
      <div class="seg" id="wealth-seg">
        <button data-w="0.5">贫瘠</button><button data-w="1" class="sel">标准</button><button data-w="2.5">富庶</button>
      </div>
    </div>
    <div class="setup-row">
      <span>史话</span>
      <div class="seg" id="hist-seg">
        <button data-h="1" class="sel">史实</button><button data-h="0">架空</button>
      </div>
    </div>
    <div class="setup-row">
      <span>群雄</span>
      <div class="seg" id="neu-seg">
        <button data-n="0.6">羸弱</button><button data-n="1" class="sel">标准</button><button data-n="1.5">精锐</button>
      </div>
    </div>
  </div>
  <button class="menu-btn primary" id="btn-start" style="margin-top:8px">出 师 ！</button>
  <button class="menu-btn" id="btn-back" style="padding:10px;font-size:14px;width:auto;min-width:140px">返回</button>
</div>

<!-- 游戏 -->
<div class="screen" id="screen-game">
  <div id="map-wrap"><svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="topbar">
    <span class="res" id="tb-fact">蜀</span>
    <span class="res" id="tb-date">200年 春</span>
    <span class="res" id="tb-gold">💰 0</span>
    <span class="res" id="tb-food">🌾 0</span>
    <span class="res" id="tb-city">🏯 0</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-tech" title="军技府">📖</button>
    <button class="icon-btn" id="btn-diplo" title="外交">🤝</button>
    <button class="icon-btn" id="btn-gens" title="武将府">👤</button>
    <button class="icon-btn" id="btn-log" title="战报日志">📜</button>
    <button class="icon-btn" id="btn-help" title="说明">❓</button>
    <button class="icon-btn" id="btn-gmenu" title="菜单">☰</button>
    <div id="powerbar"></div>
  </div>
  <button id="btn-endturn">结束回合 ▶</button>
  <div id="panel"></div>
  <div id="turn-overlay"><div class="inner">诸 侯 行 动 中 …</div></div>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script src="js/data.js?v=9"></script>
<script src="js/core.js?v=9"></script>
<script src="js/map.js?v=9"></script>
<script src="js/ui.js?v=9"></script>
<script src="js/ai.js?v=9"></script>
<script src="js/main.js?v=9"></script>
</body>
</html>

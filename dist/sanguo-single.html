<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
html{background:#141e2e;height:-webkit-fill-available}
body{
  position:fixed;inset:0;height:100dvh;min-height:-webkit-fill-available;
  background:#141e2e;color:#e8e2d0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
#map-svg text{text-rendering:optimizeSpeed}
.serif{font-family:"Songti SC","STKaiti","KaiTi","SimSun",serif}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.show{display:flex}
.dim{opacity:.55}
button{font-family:inherit}

/* ===== 主菜单 ===== */
#screen-menu,#screen-setup{
  align-items:center;justify-content:center;gap:14px;padding:24px;
  background:radial-gradient(ellipse 90% 60% at 50% 18%,#1d2c47 0%,#0b1018 70%);
}
#screen-setup{justify-content:flex-start;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
#screen-menu h1{font-size:clamp(28px,8vw,46px);margin:0;letter-spacing:clamp(4px,1.8vw,10px);color:#e8c96a;text-shadow:0 2px 18px #e8c96a44;white-space:nowrap}
#screen-menu .sub{font-size:14px;letter-spacing:6px;opacity:.6;margin-bottom:28px}
.menu-btn{
  width:min(78vw,300px);padding:15px;font-size:17px;border-radius:14px;cursor:pointer;
  border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;touch-action:manipulation;
}
.menu-btn:active{transform:scale(.97)}
.menu-btn.primary{background:linear-gradient(#d9b455,#a07f2c);border-color:#e8c96a;color:#221a06;font-weight:700}
#screen-setup h2{margin:4px 0 2px;font-size:22px;color:#e8c96a;letter-spacing:4px}
#fact-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(94vw,520px)}
.fcard{
  border:2px solid #2c3a55;border-radius:14px;padding:12px;background:#141c2b;cursor:pointer;
  transition:border-color .15s,transform .15s;touch-action:manipulation;
}
.fcard.sel{transform:scale(1.02);box-shadow:0 0 18px var(--fc,#fff5) inset,0 0 12px var(--fc,#fff3);border-color:var(--fc,#fff)}
.fcard .fname{font-size:19px;font-weight:700}
.fcard .fdesc{font-size:12px;opacity:.7;margin-top:5px;line-height:1.5}
.fcard .fgen{font-size:11px;margin-top:6px;color:#e8c96a;opacity:.85}
.seg{display:flex;border:1px solid #3a4a66;border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 18px;background:transparent;color:#e8e2d0;border:none;font-size:15px;cursor:pointer;touch-action:manipulation}
.seg button.sel{background:#caa64b;color:#221a06;font-weight:700}
.setup-row{display:flex;align-items:center;gap:12px;font-size:14px;opacity:.95}

/* ===== 游戏画面 ===== */
#map-wrap{position:absolute;inset:0;background:#141e2e}
#map-svg{width:100%;height:100%;touch-action:none;display:block}
#topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;row-gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:rgba(11,16,24,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #232f47;font-size:13px;
}
#topbar .res{white-space:nowrap}
.res{display:inline-flex;align-items:center;gap:3px;background:#16213399;border:1px solid #2a3650;border-radius:999px;padding:4px 10px;flex:none}
#tb-fact{font-weight:700;border-color:#caa64b66;color:#e8c96a}
.icon-btn{
  flex:none;width:34px;height:34px;border-radius:10px;border:1px solid #3a4a66;background:#1d2940;
  color:#e8e2d0;font-size:16px;cursor:pointer;touch-action:manipulation;padding:0;
}
.icon-btn:active{transform:scale(.93)}
#topbar .spacer{flex:1;min-width:4px}
#btn-endturn{
  position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:25;
  padding:15px 24px;font-size:17px;font-weight:800;border-radius:999px;cursor:pointer;letter-spacing:2px;
  border:1px solid #e8c96a;background:linear-gradient(#d9b455,#9a7a28);color:#221a06;
  box-shadow:0 4px 22px #d9b45566;touch-action:manipulation;transition:opacity .2s;
}
#btn-endturn:active{transform:scale(.96)}
@media (max-width:899px){
  body.panel-open #btn-endturn{opacity:0;pointer-events:none}
}

/* ===== 地图元素 ===== */
/* 势力范围块（维诺图疆域涂色） */
.tcell{stroke:#0b1018;stroke-width:1.2;stroke-opacity:.3;transition:fill .4s}
body.light .tcell{stroke:#8a7d5f;stroke-opacity:.4}
svg.no-tcell .tcell{display:none}
.edge{stroke:#46566f;stroke-width:2.5;opacity:.6;stroke-dasharray:2 7;stroke-linecap:round}
.edge.r{stroke:#4a7fae;opacity:.75}
.edge.m{stroke:#8a7a55;opacity:.7}
.ebadge-bg{fill:#0f1828;stroke:#2e3c58;stroke-width:1.2}
.ebadge{font-size:11px;text-anchor:middle;pointer-events:none}
.outer-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#9ab48e;opacity:.42;text-anchor:middle;letter-spacing:7px}
.outer-sub{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#8fa789;opacity:.32;text-anchor:middle;letter-spacing:3px}
.lake{fill:#1d3a5c;stroke:#3a679a;stroke-width:1.5;opacity:.85}
.lake-label{font-family:"Songti SC","KaiTi",serif;fill:#6f9cc9;opacity:.6;font-size:11px;text-anchor:middle}
.grass{stroke:#5a7a52;stroke-width:1.6;fill:none;opacity:.55;stroke-linecap:round}
.dune{stroke:#8a7340;stroke-width:1.8;fill:none;opacity:.5;stroke-linecap:round}
.snowmtn{stroke:#7a8aa8;stroke-width:2;fill:#243048;opacity:.85;stroke-linejoin:round}
.snowcap{fill:#c8d4e8;opacity:.8}
.tree-c{fill:#2e4a34;stroke:#4a6a50;stroke-width:1;opacity:.8}
.tree-t{stroke:#4a5a40;stroke-width:1.6;opacity:.7}
/* 分级细节：放大显示更多 */
.lod-near,.lod-close{opacity:0;transition:opacity .3s;pointer-events:none}
svg.near .lod-near{opacity:1}
svg.close .lod-close{opacity:1}
svg.far .troops,svg.far .ticon{opacity:0;transition:opacity .3s}
.cstats{font-size:10.5px;fill:#93a8c2;text-anchor:middle;paint-order:stroke;stroke:#0b1018;stroke-width:3}
.gline{font-size:10.5px;fill:#cdbce8;text-anchor:middle;paint-order:stroke;stroke:#0b1018;stroke-width:3}
.ctag{font-size:10px;fill:#b9a978;text-anchor:middle;font-family:"Songti SC","KaiTi",serif;paint-order:stroke;stroke:#0b1018;stroke-width:2.5}
.mtn-label{font-size:12.5px;fill:rgba(138,151,173,.8);text-anchor:middle;font-family:"Songti SC","KaiTi",serif;letter-spacing:2px}
.mtn-label.yue{fill:rgba(190,165,100,.85)}
.landmark{font-size:11.5px;fill:rgba(200,168,106,.88);text-anchor:middle;font-family:"Songti SC","KaiTi",serif;paint-order:stroke;stroke:#0b1018;stroke-width:2.5}
.ebadge-label{font-size:9px;fill:#8fa3c4;text-anchor:middle;paint-order:stroke;stroke:#0b1018;stroke-width:2}
.river-w{fill:none;stroke:#1d3a5c;stroke-width:13;opacity:.85;stroke-linecap:round}
.river-c{fill:none;stroke:#3a679a;stroke-width:3.5;opacity:.6;stroke-linecap:round}
.river-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#6f9cc9;opacity:.7;font-size:17px;letter-spacing:5px}
.sea{fill:url(#seaGrad);stroke:#3a577c;stroke-width:2.5;opacity:.97}
.wave{fill:none;stroke:#4a6f96;stroke-width:1.8;opacity:.4;stroke-linecap:round}
.sea-label{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#5d83ad;opacity:.55;letter-spacing:6px}
.region{font-family:"Songti SC","STKaiti","KaiTi",serif;fill:#a8bcd8;opacity:.10;font-weight:700;letter-spacing:10px;text-anchor:middle;pointer-events:none}
.mtn{stroke:#55678a;stroke-width:2.2;fill:#1b2740;opacity:.75;stroke-linejoin:round}
.mtn2{stroke:#55678a;stroke-width:1.6;fill:#16203466;opacity:.55;stroke-linejoin:round}
.frame{fill:none;stroke:#33425f;opacity:.8}
.compass{opacity:.6}
g.city{cursor:pointer}
g.city .body{stroke:#0a0e15;stroke-width:2.5}
g.city .bshadow{fill:#000;opacity:.32}
g.city .capring{fill:none;stroke:#ffd966;stroke-width:1.8;stroke-dasharray:4 3;opacity:.9}
g.city .fch{font-size:21px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0008;stroke-width:3}
g.city .name{font-size:17px;font-weight:700;fill:#e8e2d0;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b1018;stroke-width:4}
g.city .name.cap{fill:#ffd966}
g.city .troops{font-size:13.5px;fill:#aebdd2;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b1018;stroke-width:3.5}
g.city .ticon{font-size:14px;text-anchor:middle;pointer-events:none;opacity:.95}
g.city .ring{fill:none;display:none;pointer-events:none}
g.city.sel .ring{display:block;stroke:#fff;stroke-width:3}
g.city.atk .ring{display:block;stroke:#ff5f5f;stroke-width:4;animation:pulse 1.1s infinite}
g.city.mov .ring{display:block;stroke:#5fe88a;stroke-width:3;stroke-dasharray:7 7;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.25}}
.flash{animation:cityflash .5s 2}
@keyframes cityflash{50%{opacity:.2}}

/* ===== 城市面板 ===== */
#panel{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  background:rgba(19,27,42,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid #2c3a55;border-radius:20px 20px 0 0;
  max-height:52dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(108%);visibility:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.25,1),visibility 0s .28s;
}
#panel.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.25,1)}
@media (min-width:900px){
  #panel{
    left:auto;right:14px;top:66px;bottom:16px;width:368px;max-height:none;
    border:1px solid #2c3a55;border-radius:16px;transform:translateX(118%);
  }
  #panel.show{transform:none}
}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.p-head .cname{font-size:23px;font-weight:800;letter-spacing:2px}
.p-head .ftag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid;font-weight:700}
.p-head .x{margin-left:auto}
.flavor{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:13px;color:#b9a978;opacity:.85;margin-bottom:10px;letter-spacing:1px}
.statrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.stat{font-size:13px;background:#16213399;border:1px solid #2a3650;border-radius:9px;padding:5px 9px}
.stat.trait{border-color:#6a5a2a;color:#d9c08a;background:#241e1266}
.gens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.gchip{font-size:12.5px;background:#2a2338;border:1px solid #6a5a8a;border-radius:999px;padding:4px 10px;color:#d9c8f2}
.sec-title{font-size:12px;opacity:.55;margin:10px 0 7px;letter-spacing:2px}
.actgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;border-radius:12px;
  padding:10px 6px;font-size:14px;cursor:pointer;touch-action:manipulation;min-height:46px;
}
.btn small{font-size:11px;opacity:.6}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.wide{flex-direction:row;justify-content:space-between;padding:12px 14px;width:100%;margin-top:8px}
.btn.atk{border-color:#a04040;background:#3a1d22}
.btn.mov{border-color:#3f7a52;background:#1d3526}
.btn.gold{border-color:#caa64b;background:#332a14}

/* ===== 弹窗 ===== */
#modal-root{
  position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:18px;
}
#modal-root.show{display:flex}
.modal{
  background:#16213a;border:1px solid #33425f;border-radius:18px;width:100%;max-width:430px;
  max-height:82dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;
  animation:mIn .22s cubic-bezier(.2,.8,.25,1);
}
@keyframes mIn{from{transform:scale(.92) translateY(14px);opacity:0}}
.modal h3{margin:0 0 12px;font-size:19px;letter-spacing:2px;color:#e8c96a}
.modal .row{display:flex;gap:10px;margin-top:14px}
.modal .row .btn{flex:1;flex-direction:row;min-height:48px;font-size:16px}
.modal .btn.primary{background:linear-gradient(#d9b455,#9a7a28);border-color:#e8c96a;color:#221a06;font-weight:700}
input[type=range]{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;margin:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:#2a3650}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-11px;
  background:linear-gradient(#e8c96a,#a07f2c);border:2px solid #fff3;box-shadow:0 2px 8px #000a;
}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:#2a3650}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#d9b455;border:2px solid #fff3}
.qbtns{display:flex;gap:8px}
.qbtns button{flex:1;padding:7px 0;border-radius:9px;border:1px solid #3a4a66;background:#1d2940;color:#e8e2d0;font-size:13px;cursor:pointer;touch-action:manipulation}
.gchk{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;background:#2a2338;border:1px solid #6a5a8a;
  border-radius:999px;padding:6px 12px;margin:3px 4px 3px 0;color:#d9c8f2;cursor:pointer;
}
.gchk input{width:17px;height:17px;accent-color:#caa64b}
.est{margin-top:12px;padding:10px 12px;border-radius:10px;background:#101828;border:1px solid #2a3650;font-size:14px;text-align:center}
.battle-stage{text-align:center;padding:18px 0;font-size:38px;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}
.b-result{text-align:center;font-size:23px;font-weight:800;margin:10px 0;letter-spacing:2px}
.b-result.win{color:#6fe89a}.b-result.lose{color:#ff7a7a}
.b-side{display:flex;justify-content:space-between;background:#101828;border:1px solid #2a3650;border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px}
.duel{
  margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.8;
  background:#2a1d10;border:1px solid #8a6f3a;color:#e8cf9a;
}
.loglist{font-size:13.5px;line-height:1.9;max-height:56dvh;overflow-y:auto}
.loglist div{border-bottom:1px dashed #2a3650;padding:3px 0}
.helpbox{font-size:14px;line-height:1.9}
.helpbox b{color:#e8c96a}
.hist-item{
  background:linear-gradient(#262013,#1e1a10);border:1px solid #8a6f3a;border-radius:12px;
  padding:12px 14px;margin-bottom:10px;
}
.hist-title{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:17px;color:#e8c96a;letter-spacing:2px;margin-bottom:6px}
.g-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #2a3650;font-size:14px}
.g-row .g-info{flex:1;min-width:0}
.g-row .g-stats{font-size:12.5px;opacity:.85;margin-top:2px}
g.city.small .fch{font-size:14px}
g.city.small .name{font-size:14px}
g.city.small .troops{font-size:11px}
g.city.small .ticon{font-size:12px}
.hist-text{font-family:"Songti SC","STKaiti","KaiTi",serif;font-size:14.5px;line-height:2;color:#d9cba8}

/* ===== 水墨浅色主题 ===== */
body.light{background:#e9e2cf;color:#2a241a}
body.light html{background:#e9e2cf}
body.light #map-wrap{background:#e2d9c2}
body.light #topbar{background:rgba(238,231,212,.85);border-bottom-color:#c8bda0}
body.light .res{background:#fffaf0cc;border-color:#cfc4a6;color:#3a3322}
body.light #tb-fact{color:#8a6a1a;border-color:#b89a4a}
body.light .icon-btn,body.light .btn{background:#f2ecd9;border-color:#bdb293;color:#2a241a}
body.light .btn.gold{background:#f0e2b8;border-color:#b89a4a}
body.light .btn.atk{background:#f2d9d4;border-color:#c08a7f}
body.light .btn.mov{background:#dcecd9;border-color:#8ab08a}
body.light #panel,body.light .modal{background:rgba(248,243,229,.97);border-color:#c8bda0;color:#2a241a}
body.light .stat,body.light .est{background:#f0ead7;border-color:#cfc4a6}
body.light .stat.trait{background:#f0e6c8;color:#7a5f1a;border-color:#b8a05a}
body.light .gchip,body.light .gchk{background:#e8ddf0;border-color:#9a82b8;color:#4a3a66}
body.light .b-side,body.light .loglist div{background:#f0ead7;border-color:#cfc4a6}
body.light .modal h3{color:#8a6a1a}
body.light .toast{background:rgba(248,243,229,.96);border-color:#bdb293;color:#2a241a}
body.light .hist-item{background:linear-gradient(#f4ecd4,#ece2c4);border-color:#b89a4a}
body.light .hist-title{color:#8a6a1a}
body.light .hist-text{color:#5a4a2a}
body.light .duel{background:#f4e8cc;border-color:#b89a4a;color:#7a5a1a}
body.light #turn-overlay{background:rgba(240,234,215,.6);color:#8a6a1a}
/* 浅色地图 */
body.light .land-base{fill:#e2d9c2}
body.light .land-glow{fill:#dcd2b6}
body.light .sea{fill:#bdd0dd;stroke:#8aa8bd}
body.light .wave{stroke:#8aa8bd}
body.light .sea-label,body.light .river-label,body.light .lake-label{fill:#5a7d9a}
body.light .river-w{stroke:#a8c2d6}
body.light .river-c{stroke:#7fa3c0}
body.light .lake{fill:#a8c2d6;stroke:#7fa3c0}
body.light .edge{stroke:#9a8e72}
body.light .edge.r{stroke:#7fa3c0}
body.light .edge.m{stroke:#a08a5f}
body.light .region{fill:#5a4f38}
body.light .mtn{fill:#cfc4a6;stroke:#8a7d5f}
body.light .mtn2{fill:#d9cfb2;stroke:#9a8e72}
body.light .snowmtn{fill:#c2cdd9;stroke:#8a99ad}
body.light .mtn-label{fill:rgba(90,79,56,.85)}
body.light .mtn-label.yue{fill:rgba(140,108,40,.9)}
body.light .landmark{fill:rgba(140,108,40,.95);stroke:#f0ead7}
body.light .grass{stroke:#7d9468}
body.light .dune{stroke:#b89a5f}
body.light .tree-c{fill:#9ab388;stroke:#7d9468}
body.light g.city .name{fill:#2a241a;stroke:#f0ead7}
body.light g.city .name.cap{fill:#8a5f0a}
body.light g.city .troops{fill:#5a4f38;stroke:#f0ead7}
body.light g.city .cstats{fill:#6a5f44;stroke:#f0ead7}
body.light g.city .gline{fill:#5a4470;stroke:#f0ead7}
body.light g.city .ctag{fill:#7a5f2a;stroke:#f0ead7}
body.light g.city .bshadow{opacity:.2}
body.light g.city.sel .ring{stroke:#2a241a}
body.light .ebadge-bg{fill:#f0ead7;stroke:#bdb293}
body.light .ebadge-label{fill:#6a5f44;stroke:#f0ead7}
body.light .compass circle{fill:#f0ead7;stroke:#9a8e72}
body.light .frame{stroke:#9a8e72}
/* ===== 提示 ===== */
#toasts{
  position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw;
}
.toast{

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SAVE_KEY='sgbh_save_v8';

/* ============ 音效 ============ */
const Sound={
  ctx:null,on:store.get('sgbh_sound')!=='0',
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,t,dur,type,vol){
    type=type||'sine';vol=vol===undefined?.18:vol;
    if(!this.on||!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(this.ctx.destination);
    const now=this.ctx.currentTime+t;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.012);
    g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.start(now);o.stop(now+dur+.05);
  },
  play(k){
    if(!this.on||!this.ctx)return;
    switch(k){
      case 'tap':this.tone(660,0,.06,'triangle',.1);break;
      case 'coin':this.tone(880,0,.09,'triangle');this.tone(1320,.07,.12,'triangle');break;
      case 'march':this.tone(220,0,.12,'square',.08);this.tone(180,.12,.14,'square',.08);break;
      case 'battle':this.tone(110,0,.25,'sawtooth',.14);this.tone(90,.18,.3,'sawtooth',.14);break;
      case 'duel':this.tone(1100,0,.07,'square',.1);this.tone(1400,.09,.07,'square',.1);this.tone(900,.18,.12,'square',.1);break;
      case 'win':[523,659,784,1047].forEach((f,i)=>this.tone(f,i*.11,.22,'triangle'));break;
      case 'lose':[440,370,294,220].forEach((f,i)=>this.tone(f,i*.13,.25,'sine'));break;
      case 'turn':this.tone(392,0,.1,'triangle');this.tone(523,.09,.14,'triangle');break;
      case 'hist':this.tone(330,0,.3,'sine',.12);this.tone(440,.22,.35,'sine',.12);break;
    }
  }
};
document.addEventListener('pointerdown',()=>Sound.init(),{once:false});

/* ============ 游戏状态 ============ */
let state=null,selected=-1,busy=false;

function newGame(playerFid,diff,opts){
  opts=Object.assign({wealth:1,hist:true,neu:1},opts||{});
  state={
    v:8,player:playerFid,diff:diff,turn:1,year:200,season:0,won:false,fired:[],opts:opts,
    factions:{},log:[],
    cities:CITY_DEFS.map(d=>({name:d[0],x:d[1],y:d[2],owner:d[3],
      troops:d[3]==='neutral'?Math.round(d[4]*opts.neu):d[4],
      farm:d[5],comm:d[6],wall:d[7],cap:d[8],trait:d[9],tag:d[10],tired:0,devUsed:false,recUsed:false})),
    generals:GEN_DEFS.map((g,i)=>({id:i,name:g[0],war:g[1],wu:g[2],int:g[3],pol:g[4],cha:g[5],
      fid:g[6],city:g[7],skill:g[8],title:null,
      loy:g[0]===FACTS[g[6]].leader?100:82+ri(0,14)})),
    pool:POOL_DEFS.map((g,i)=>({id:100+i,name:g[0],war:g[1],wu:g[2],int:g[3],pol:g[4],cha:g[5],debut:g[6],skill:g[7]})),
    pendingCaptives:[],
    rkLast:0,truce:{},stratUsed:false,
  };
  MAJORS.forEach(f=>{state.factions[f]={gold:Math.round(2000*opts.wealth),food:Math.round(2500*opts.wealth),
    alive:true,techs:[],researching:null}});
  addLog(`${FACTS[playerFid].leader}举义兵于${capOf(playerFid)}，大业自此始！`);
}
function capOf(fid){const c=state.cities.find(c=>c.owner===fid&&c.cap);return c?c.name:'';}
function C(i){return state.cities[i]}
function F(fid){return state.factions[fid]}
function cityIdsOf(fid){return state.cities.map((c,i)=>c.owner===fid?i:-1).filter(i=>i>=0)}
function generalsIn(cid){return state.generals.filter(g=>g.city===cid&&g.fid===C(cid).owner)}
function gensOf(fid){return state.generals.filter(g=>g.fid===fid)}
function bestGen(gens){return gens.reduce((a,b)=>effWar(a)>effWar(b)?a:b)}
function bestWuGen(gens){return gens.reduce((a,b)=>duelPower(a)>duelPower(b)?a:b)}
function skillName(g){return g.skill?SKILLS[g.skill].name:''}
function hasSkillIn(cid,sk){return generalsIn(cid).some(g=>g.skill===sk)}
function courtHas(fid,sk){return state.generals.some(g=>g.fid===fid&&g.skill===sk)}
function duelPower(g){return g.wu+(g.skill==='shen'?12:0)}
function armyMult(gens){
  if(!gens.length)return 1;
  const best=Math.max(...gens.map(g=>effWar(g)));
  let m=1+(best-60)/150+0.02*Math.min(gens.length-1,3);
  if(gens.some(g=>g.skill==='fei'))m*=1.08; // 飞将
  return m;
}
function leadName(gens){return gens.length?bestGen(gens).name:'无'}
function maxLv(c,kind){return kind==='wall'?6:(c.trait==='pass'?3:10)}
/* 城池驻兵上限：城防与农商规模决定 */
function cityCap(c){return 8000+c.wall*4000+(c.farm+c.comm)*1500}
/* 统兵上限：武将统率×200 累加；无将仅 5000 民兵 */
function leadCap(gens){return gens&&gens.length?gens.reduce((a,g)=>a+effWar(g)*300,0):8000}
/* 太守：驻城政治最高者，提振城中金粮 */
function governorOf(cid){
  const gens=generalsIn(cid);
  if(!gens.length)return null;
  return gens.reduce((a,b)=>b.pol>a.pol?b:a);
}
/* 武将调驻 */
function moveGeneral(gid,cid){
  const g=state.generals.find(x=>x.id===gid);
  const f=F(state.player);
  if(!g||g.fid!==state.player||C(cid).owner!==state.player)return false;
  if(f.gold<100){toast('💰 调驻需 100 金');return false;}
  f.gold-=100;
  const from=g.city>=0?C(g.city).name:'—';
  g.city=cid;
  addLog(`调 ${g.name} 自${from}移驻 ${C(cid).name}`);
  toast(`🐎 ${g.name} 移驻 ${C(cid).name}`);
  Sound.play('march');
  save();renderAll();
  return true;
}
function recruitMult(c){
  let m=c.trait==='horse'?0.75:c.trait==='wild'?0.65:1;
  if(hasSkillIn(state.cities.indexOf(c),'mu'))m*=0.8;          // 募兵
  if(MAJORS.includes(c.owner)&&techDone(c.owner,'zheng'))m*=0.85; // 征兵令
  return m;
}
function rankIdxOf(fid){const n=cityIdsOf(fid).length;let r=0;RANKS.forEach((x,i)=>{if(n>=x.c)r=i});return r;}
function titleOf(g){return g.title?TITLES.find(t=>t.id===g.title):null}
function effWar(g){const t=titleOf(g);return Math.min(100,g.war+(t?t.bonus:0))}
function countTitle(fid,id){return state.generals.filter(g=>g.fid===fid&&g.title===id).length}
function techDone(fid,id){return F(fid)&&F(fid).techs&&F(fid).techs.includes(id)}
function dateStr(){return `${state.year}年 ${SEASONS[state.season]}`}
function addLog(msg){state.log.push(`【${dateStr()}】${msg}`);if(state.log.length>300)state.log.shift()}
function availPool(){return state.pool.filter(p=>p.debut<=state.year)}
function drawPool(){
  const av=availPool();
  if(!av.length)return null;
  const g=av[ri(0,av.length-1)];
  state.pool.splice(state.pool.indexOf(g),1);
  return g;
}
function hireGeneral(g,fid,cid,loy){
  state.generals.push({id:g.id,name:g.name,war:g.war,wu:g.wu,int:g.int||50,pol:g.pol||50,cha:g.cha||50,
    fid:fid,city:cid,skill:g.skill||null,title:null,loy:loy||85});
}
function toPool(g){
  const i=state.generals.indexOf(g);
  if(i>=0)state.generals.splice(i,1);
  state.pool.push({id:g.id,name:g.name,war:g.war,wu:g.wu,int:g.int,pol:g.pol,cha:g.cha,debut:state.year,skill:g.skill});
}
function save(){
  if(!store.set(SAVE_KEY,JSON.stringify(state))&&!save.warned){
    save.warned=true;toast('⚠️ 此环境无法持久存档，关闭页面进度将丢失');
  }
}
function loadSave(){
  const s=store.get(SAVE_KEY);
  if(!s)return false;
  try{const o=JSON.parse(s);if(o&&o.v===8&&o.cities&&o.cities.length===CITY_DEFS.length){state=o;return true}}catch(e){}
  return false;
}

/* ============ 计略 ============ */
function stratIntOf(fid){
  const gs=gensOf(fid);
  let v=gs.length?Math.max(...gs.map(g=>g.int)):50;
  if(courtHas(fid,'suan'))v+=12;       // 神算
  return v;
}
function stratChance(cid){
  const atk=stratIntOf(state.player);
  const dg=generalsIn(cid);
  let def=dg.length?Math.max(...dg.map(g=>g.int)):50;
  if(hasSkillIn(cid,'kan'))def+=20;    // 看破
  return clamp(0.5+(atk-def)/200,0.15,0.9);
}
function stratCost(base){return courtHas(state.player,'gui')?Math.round(base*0.6):base} // 鬼谋
function doStrat(cid,kind){
  const c=C(cid),f=F(state.player);
  if(state.stratUsed)return;
  const cost=stratCost(kind==='rumor'?600:kind==='burn'?900:1500);
  if(f.gold<cost){toast('💰 金钱不足');return;}
  f.gold-=cost;state.stratUsed=true;
  const ok=Math.random()<stratChance(cid);
  if(!ok){
    Sound.play('lose');
    toast(`💨 细作败露，${c.name} 守备愈严！`);addLog(`行计 ${c.name} 败露`);
  }else{
    Sound.play('coin');flashCity(cid);
    if(kind==='rumor'){
      c.wall=Math.max(0,c.wall-1);
      toast(`🗣 流言四起，${c.name} 城防松动（-1）！`);addLog(`流言乱 ${c.name}，城防受损`);
    }else if(kind==='burn'){
      const d=Math.floor(c.troops*0.12);
      c.troops-=d;c.tired=Math.min(c.tired,c.troops);
      if(MAJORS.includes(c.owner))F(c.owner).food=Math.max(0,F(c.owner).food-800);
      toast(`🔥 火烧粮屯！${c.name} 守军折损 ${d}`);addLog(`烧 ${c.name} 粮屯，敌军折损 ${d}`);
    }else{
      const dg=generalsIn(cid);
      if(dg.length){
        const g=dg[ri(0,dg.length-1)];
        g.loy=Math.max(0,(g.loy||80)-30);
        if(g.loy<50){
          toPool(g);
          toast(`🕊 离间得逞！${g.name} 心灰意冷，挂印而去`);addLog(`离间 ${c.name}，${g.name} 出走在野`);
        }else{
          toast(`🕊 流言入耳，${g.name} 心生嫌隙（忠诚 ${g.loy}）`);addLog(`离间 ${g.name}，其忠诚动摇`);
        }
      }
    }
  }
  save();renderAll();
}

/* ============ 战力计算 ============ */
function terrainFactor(et,gens,fromTrait){
  let pen=et==='r'?(fromTrait==='port'?0:0.15):et==='m'?0.12:0;
  if(pen>0&&gens&&gens.some(g=>g.skill==='ji'))pen*=0.5; // 疾驰
  return 1-pen;
}
function atkPowerOf(commit,gens,fromCid,toCid){
  let m=armyMult(gens);
  const t=C(fromCid).trait;
  const fid=C(fromCid).owner;
  if(t==='horse'||t==='port')m*=1.08;
  if(state.season===3)m*=0.9;
  if(MAJORS.includes(fid)){
    if(techDone(fid,'qiang'))m*=1.05;
    if(toCid!==undefined&&techDone(fid,'qixie'))m*=1.08;
  }
  if(toCid!==undefined)m*=terrainFactor(edgeType(fromCid,toCid),gens,t);
  return commit*m;
}
function terrainNote(fromCid,toCid){
  const et=edgeType(fromCid,toCid);
  if(et==='r')return C(fromCid).trait==='port'?'⛵ 舟师渡江，如履平地':'🌊 渡江强攻 -15%';
  if(et==='m')return '⛰ 山道险阻 -12%';
  return '';
}
function defPowerOf(cid){
  const d=C(cid);
  const gens=generalsIn(cid);
  let m=armyMult(gens)*(1+d.wall*0.06)*1.12;
  if(!gens.length&&MAJORS.includes(d.owner))m*=0.9;      // 群龙无首
  if(d.trait==='fort')m*=1.15;
  if(d.trait==='pass')m*=1.3;
  if(hasSkillIn(cid,'tie'))m*=1.1;                       // 铁壁
  if(MAJORS.includes(d.owner)&&techDone(d.owner,'shou'))m*=1.08;
  if(MAJORS.includes(d.owner)&&cityIdsOf(d.owner).length<=3)m*=1.1;
  return Math.max(1,d.troops)*m;
}

/* ============ 武将去留：城破俘虏 / 出奔 ============ */
function captureOrFlee(cid,attFid,report){
  const owner=C(cid).owner;
  const others=cityIdsOf(owner).filter(i=>i!==cid);
  state.generals.filter(g=>g.fid===owner&&g.city===cid).forEach(g=>{
    const isLeader=g.name===FACTS[owner].leader;
    if(g.skill!=='yun'&&!isLeader&&Math.random()<0.4){ // 强运/君主不被俘
      g.fid='cap';g.city=-1;g.captor=attFid;
      if(report)report.captives.push(g.id);
    }else if(others.length){
      g.city=others[ri(0,others.length-1)];
    }else{
      toPool(g);
    }
  });
}
function tryRecruitCaptive(g,fid){
  const gs=gensOf(fid);
  const charm=gs.length?Math.max(...gs.map(x=>x.cha)):60;
  let p=clamp(0.7-(g.loy||80)/150+charm/400+(courtHas(fid,'ren')?0.15:0),0.05,0.9);
  if(Math.random()<p){
    g.fid=fid;g.title=null;g.loy=62+ri(0,10);
    const home=cityIdsOf(fid);
    g.city=home.length?home[ri(0,home.length-1)]:-1;
    delete g.captor;
    return true;
  }
  return false;
}
function releaseCaptive(g){
  const orig=MAJORS.find(f=>gensOf(f).length&&false); // 原势力不可考则归野
  const ownerAlive=MAJORS.find(f=>FACTS[f].leader!==g.name&&false);
  // 简化：释放即归在野（乱世飘零）
  delete g.captor;
  toPool(g);
}
function checkElimination(fid){
  if(!MAJORS.includes(fid))return;
  if(cityIdsOf(fid).length===0&&F(fid).alive){
    F(fid).alive=false;
    state.generals.filter(g=>g.fid===fid).forEach(g=>{g.fid='pool2';toPool(g)});
    state.generals=state.generals.filter(g=>g.fid!=='pool2');
    const msg=`💀 ${FACTS[fid].name}国覆灭，${FACTS[fid].leader}败走！`;
    addLog(msg);toast(msg);
  }
}
function maybeRecruitPool(fid,cid){
  if(Math.random()>0.5)return null;
  const g=drawPool();
  if(!g)return null;
  hireGeneral(g,fid,cid,80);
  return g;
}
function nerfCities(fid,keep){
  const k=(state&&fid===state.player)?(1+keep)/2:keep;
  cityIdsOf(fid).forEach(i=>{const c=C(i);c.troops=Math.max(800,Math.floor(c.troops*k));c.tired=Math.min(c.tired,c.troops)});
}

/* ============ 战斗 ============ */
function doBattle(from,to,commit,genIds){
  const A=C(from),D=C(to);
  const attFid=A.owner,defFid=D.owner;
  const ag=genIds.map(id=>state.generals.find(g=>g.id===id)).filter(Boolean);
  const dg=generalsIn(to);
  let duel=null,duelA=1,duelD=1;
  if(ag.length&&dg.length&&Math.random()<0.35){
    const a=bestWuGen(ag),d=bestWuGen(dg);
    const aWin=duelPower(a)+rnd(0,30)>duelPower(d)+rnd(0,30);
    if(aWin)a.wu=Math.min(100,a.wu+1);else d.wu=Math.min(100,d.wu+1);
    const winner=aWin?a:d;
    const extra=winner.skill==='wei'?0.05:0; // 威风
    duel={a:a.name,d:d.name,aWin,
      text:DUEL_WIN[ri(0,DUEL_WIN.length-1)]
        .replaceAll('{w}',aWin?a.name:d.name).replaceAll('{l}',aWin?d.name:a.name)
        .replaceAll('{s}',aWin?'攻':'守')};
    if(aWin)duelA=1.15+extra;else duelD=1.15+extra;
  }
  const atkP=atkPowerOf(commit,ag,from,to)*duelA*rnd(0.88,1.12);
  const defP=defPowerOf(to)*duelD*rnd(0.88,1.12);
  const tot=atkP+defP;
  const won=atkP>defP;
  let attLoss=Math.min(commit,Math.round(commit*(defP/tot)*0.9));
  let defLoss;
  A.troops-=commit;A.tired=Math.min(A.tired,A.troops);
  let joined=null;
  const report={from,to,attFid,defFid,commit,won,duel,captives:[],
    attLead:leadName(ag),defLead:leadName(dg),
    involvesPlayer:attFid===state.player||defFid===state.player};
  if(won){
    defLoss=D.troops;
    const surv=commit-attLoss;
    captureOrFlee(to,attFid,report);
    const prevOwner=D.owner;
    D.owner=attFid;D.troops=surv;D.tired=surv;
    D.wall=Math.max(0,D.wall-1);D.devUsed=false;D.recUsed=false;
    ag.forEach(g=>g.city=to);
    if(ag.length){const lg=bestGen(ag);lg.war=Math.min(99,lg.war+1);}
    if(prevOwner==='neutral')joined=maybeRecruitPool(attFid,to);
    addLog(`${FACTS[attFid].name}军${leadName(ag)!=='无'?'('+leadName(ag)+')':''} 攻克 ${D.name}！歼敌 ${defLoss}，自损 ${attLoss}`);
    checkElimination(prevOwner);
  }else{
    defLoss=Math.min(D.troops,Math.round(D.troops*(atkP/tot)*0.9));
    const surv=commit-attLoss;
    A.troops+=surv;A.tired+=surv;
    D.troops-=defLoss;
    if(dg.length){const lg=bestGen(dg);lg.war=Math.min(99,lg.war+1);}
    let wallNote='';
    const ramOk=atkP>defP*0.6||(MAJORS.includes(attFid)&&techDone(attFid,'qixie'));
    if(ramOk&&D.wall>0){D.wall--;wallNote=`，${D.name} 城垣受损`;}
    addLog(`${FACTS[attFid].name}军强攻 ${D.name} 受挫，损兵 ${attLoss}，守军折损 ${defLoss}${wallNote}`);
  }
  flashCity(to);
  report.attLoss=attLoss;report.defLoss=defLoss;report.joined=joined;
  // 俘虏处置：AI 立即招降，玩家进入待决名单
  report.captives.slice().forEach(gid=>{
    const g=state.generals.find(x=>x.id===gid);
    if(!g)return;
    if(attFid===state.player){
      state.pendingCaptives.push(gid);
    }else{
      if(tryRecruitCaptive(g,attFid)){
        if(report.involvesPlayer)addLog(`${g.name} 被${FACTS[attFid].name}军俘获，归降之`);
      }else releaseCaptive(g);
    }
  });
  return report;
}
function doTransfer(from,to,n,genIds){
  const A=C(from),B=C(to);
  n=Math.min(n,Math.max(0,cityCap(B)-B.troops)); // 目标城容量限制
  if(n<=0){toast(`${B.name} 营垒已满，无法再驻军`);return;}
  A.troops-=n;A.tired=Math.min(A.tired,A.troops);
  B.troops+=n;
  if(!techDone(A.owner,'yi'))B.tired+=n; // 驿传：调动无需休整
  genIds.forEach(id=>{const g=state.generals.find(g=>g.id===id);if(g)g.city=to;});
  addLog(`${A.name} 移兵 ${n} 至 ${B.name}`);
}

/* ============ 外交 ============ */
function truceLeft(fid){return (state.truce&&state.truce[fid])||0}

/* ============ 科技 ============ */
function startResearch(fid,techId){
  const f=F(fid),t=TECHS.find(x=>x.id===techId);
  if(!t||f.researching||f.techs.includes(techId)||f.gold<t.cost)return false;
  f.gold-=t.cost;
  f.researching={id:techId,left:t.turns};
  return true;
}
function tickResearch(){
  MAJORS.forEach(fid=>{
    const f=F(fid);
    if(!f.alive||!f.researching)return;
    f.researching.left--;
    if(f.researching.left<=0){
      f.techs.push(f.researching.id);
      const t=TECHS.find(x=>x.id===f.researching.id);
      f.researching=null;
      if(fid===state.player){
        Sound.play('win');
        toast(`📖 「${t.name}」研习功成！${t.desc}`);addLog(`研成 ${t.name}`);
      }
    }
  });
}

/* ============ 经济与时间 ============ */
function neutralRegen(){
  const cap=Math.round(14000*(state.opts?state.opts.neu:1));
  state.cities.forEach(c=>{
    if(c.owner==='neutral'&&c.troops<cap)c.troops=Math.min(cap,c.troops+250);
  });
}
function incomeAll(){
  MAJORS.forEach(fid=>{
    const f=F(fid);
    if(!f.alive)return;
    const mult=fid===state.player?1:state.diff;
    let gold=0,food=0,troops=0;
    cityIdsOf(fid).forEach(i=>{
      const c=C(i);
      let g=(GOLD_BASE+c.comm*GOLD_PER_COMM)*(c.trait==='trade'?1.4:1);
      let fd=c.farm*FOOD_PER_FARM*(state.season===2?2:1)*(c.trait==='gran'?1.4:1);
      if(hasSkillIn(i,'shang'))g*=1.2;  // 商才
      if(hasSkillIn(i,'tun'))fd*=1.2;   // 屯田
      const gov=governorOf(i);          // 太守理政：政治越高金粮越丰
      if(gov){const gb=1+Math.min(0.25,gov.pol/400);g*=gb;fd*=gb;}
      gold+=g;food+=fd;troops+=c.troops;
    });
    if(techDone(fid,'shi'))gold*=1.15;
    if(techDone(fid,'tun'))food*=1.15;
    let upkeep=troops*UPKEEP;
    if(techDone(fid,'juntun'))upkeep*=0.8;
    f.gold+=Math.round(gold*mult*(1+RANKS[rankIdxOf(fid)].inc));
    f.food+=Math.round(food*mult-upkeep);
    if(f.food<0){
      cityIdsOf(fid).forEach(i=>{const c=C(i);const d=Math.floor(c.troops*0.08);c.troops-=d;c.tired=Math.min(c.tired,c.troops);});
      f.food=0;
      if(fid===state.player){toast('⚠️ 军粮告罄，士卒逃散！');addLog('军粮不足，各城士卒逃散 8%');}
    }
  });
}
function randomEvent(){
  if(Math.random()>0.3)return;
  const ids=cityIdsOf(state.player);
  if(!ids.length)return;
  const cid=ids[ri(0,ids.length-1)],c=C(cid);
  const ev=EVENTS[ri(0,EVENTS.length-1)];
  ev.f(F(state.player),c);
  const msg=ev.t.replace('{c}',c.name);
  toast(msg);addLog(msg);
}
function checkDefections(){
  state.generals.slice().forEach(g=>{
    if(!MAJORS.includes(g.fid))return;
    if(g.name===FACTS[g.fid].leader)return;

      const msg=`🌟 少年英杰「${p.name}」（统${p.war}/武${p.wu}/智${p.int}）初出茅庐，流落在野`;
      toast(msg);addLog(msg);
    });
  }
  state.cities.forEach(c=>{c.tired=0;c.devUsed=false;c.recUsed=false;});
  state.stratUsed=false;
  if(state.truce)Object.keys(state.truce).forEach(k=>{if(state.truce[k]>0)state.truce[k]--});

}
function checkHistory(){
  if(state.opts&&!state.opts.hist)return [];
  const fired=[];
  HISTORY.forEach(h=>{
    if(state.fired.includes(h.id))return;
    if(state.year<h.y||(state.year===h.y&&state.season<h.s))return;
    state.fired.push(h.id);
    if(!h.cond())return;
    let extra='';
    try{extra=h.fx()||''}catch(e){}
    fired.push({title:h.title,text:h.text+(extra?'<br>'+extra:''),year:h.y});
    addLog(`〔史〕${h.title}`);
  });
  return fired;
}

function clipHalf(poly,nx,ny,mx,my){
  const out=[];
  for(let k=0;k<poly.length;k++){
    const a=poly[k],b=poly[(k+1)%poly.length];
    const da=(a[0]-mx)*nx+(a[1]-my)*ny;
    const db=(b[0]-mx)*nx+(b[1]-my)*ny;
    if(da<=0)out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){
      const t=da/(da-db);
      out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);
    }
  }
  return out;
}

function buildMap(){
  svg.innerHTML='';
  applyVB();
  buildTerrain();
  cellRefs=[];
  const cellG=svgEl('g',{});
  // 小切角圆滑：疆界既圆润又相互贴合（只在角点做 22% 切角）
  const T=0.22;
  const smoothPath=pts=>{
    const n=pts.length;
    const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
    let d='';
    for(let i=0;i<n;i++){
      const prev=pts[(i-1+n)%n],p=pts[i],next=pts[(i+1)%n];
      const a=lerp(p,prev,T),b=lerp(p,next,T);
      d+=(i===0?`M ${a[0].toFixed(1)},${a[1].toFixed(1)}`:` L ${a[0].toFixed(1)},${a[1].toFixed(1)}`)
        +` Q ${p[0].toFixed(1)},${p[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
    }
    return d+' Z';
  };
  computeCells().forEach((poly,i)=>{
    if(poly.length<3){cellRefs.push(null);return;}
    const p=svgEl('path',{class:'tcell',d:smoothPath(poly)});
    cellG.appendChild(p);cellRefs.push(p);
  });
  svg.appendChild(cellG);
  if(store.get('sgbh_tcell')==='0')svg.classList.add('no-tcell');
  const eg=svgEl('g',{});
  edgeRefs={};
  EDGES.forEach(e=>{
    const a=e[0],b=e[1],t=e[2];
    const ln=svgEl('line',{class:'edge'+(t!=='p'?' '+t:''),x1:C(a).x,y1:C(a).y,x2:C(b).x,y2:C(b).y});
    edgeRefs[Math.min(a,b)+'-'+Math.max(a,b)]=ln;
    eg.appendChild(ln);
    if(t!=='p'){
      const mx=(C(a).x+C(b).x)/2,my=(C(a).y+C(b).y)/2;
      const bg=svgEl('g',{transform:`translate(${mx},${my})`});
      const bz=svgEl('g',{class:'zoomer'});
      bz.appendChild(svgEl('circle',{class:'ebadge-bg',cx:0,cy:0,r:9.5}));
      const bt=svgText('ebadge',0,4,ETYPE_INFO[t].icon);
      bt.setAttribute('fill',t==='r'?'#7fb3e8':'#c8b88a');
      bz.appendChild(bt);
      bz.appendChild(svgText('ebadge-label lod-close',0,20,ETYPE_INFO[t].name));
      bg.appendChild(bz);
      eg.appendChild(bg);
    }
  });
  svg.appendChild(eg);
  cityRefs=[];
  state.cities.forEach((c,i)=>{
    const small=c.trait==='pass';
    const g=svgEl('g',{class:'city'+(small?' small':''),'data-id':i,transform:`translate(${c.x},${c.y})`});
    const z=svgEl('g',{class:'zoomer'});
    z.appendChild(svgEl('circle',{class:'ring',r:small?26:34}));
    if(c.cap)z.appendChild(svgEl('circle',{class:'capring',r:29}));
    z.appendChild(svgEl('circle',{class:'bshadow',cx:1.5,cy:3.5,r:small?17:24}));
    z.appendChild(svgEl('circle',{class:'body',r:small?17:24}));
    z.appendChild(svgEl('circle',{r:small?17:24,fill:'url(#shine)','pointer-events':'none'}));
    const fch=svgEl('text',{class:'fch',y:small?5:7});z.appendChild(fch);
    const ti=svgEl('text',{class:'ticon',y:small?-24:-32});ti.textContent=TRAITS[c.trait].icon;z.appendChild(ti);
    const nm=svgEl('text',{class:'name'+(c.cap?' cap':''),y:small?34:46});nm.textContent=(c.cap?'★':'')+c.name;z.appendChild(nm);
    const tr=svgEl('text',{class:'troops',y:small?48:63});z.appendChild(tr);
    z.appendChild(svgEl('text',{class:'cstats lod-near',y:small?61:77}));
    z.appendChild(svgEl('text',{class:'gline lod-near',y:small?74:91}));
    z.appendChild(svgEl('text',{class:'cincome lod-close',y:small?87:105}));
    const tg=svgEl('text',{class:'ctag lod-close',y:small?100:119});
    tg.textContent='『'+c.tag.split('，')[0]+'』';z.appendChild(tg);
    g.appendChild(z);
    svg.appendChild(g);
    cityRefs.push({g,body:z.querySelector('.body'),fch,troops:tr,
      cstats:z.querySelector('.cstats'),gline:z.querySelector('.gline'),
      cincome:z.querySelector('.cincome')});
  });
  svg.appendChild(svgEl('g',{id:'fx-layer'}));
  zoomerEls=[...svg.querySelectorAll('.zoomer')];
  zoomPtEls=[...svg.querySelectorAll('.zoom-pt')];
  lastK=0;updateZoomScale();

function animateMarch(from,to,color,cb){
  const layer=$('#fx-layer');
  const a=C(from),b=C(to);
  const dot=svgEl('circle',{r:11,fill:color,stroke:'#fff','stroke-width':2.5});
  layer.appendChild(dot);
  Sound.play('march');
  let done=false;
  const finish=()=>{if(done)return;done=true;dot.remove();cb&&cb();};
  const t0=performance.now(),dur=620;
  (function step(t){
    if(done)return;
    const p=Math.min(1,(t-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    dot.setAttribute('cx',a.x+(b.x-a.x)*e);
    dot.setAttribute('cy',a.y+(b.y-a.y)*e-Math.sin(p*Math.PI)*18);
    if(p<1)requestAnimationFrame(step);else finish();
  })(t0);
  setTimeout(finish,dur+350); // 兜底：任何环境下动画停滞也不会卡死回合
}

/* ============ 手势 ============ */
(function(){
  const ptrs=new Map();
  let vbStart=null,ctmInv=null,startMid=null,startDist=0,anchor=null,moved=0,downT=0;
  function ptUnderStart(x,y){
    const pt=svg.createSVGPoint();pt.x=x;pt.y=y;
    return pt.matrixTransform(ctmInv);
  }
  function mid(){
    const a=[...ptrs.values()];
    if(a.length===1)return{x:a[0].x,y:a[0].y};
    return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  }
  function dist(){
    const a=[...ptrs.values()];
    if(a.length<2)return 0;
    return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
  function beginGesture(){
    vbStart={...vb};
    ctmInv=svg.getScreenCTM().inverse();
    startMid=mid();startDist=dist();
    anchor=ptUnderStart(startMid.x,startMid.y);
  }
  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size<=2)beginGesture();
    if(ptrs.size===1){moved=0;downT=performance.now();}
  });
  let rafPending=false;
  function doPan(){
    if(!vbStart||!ptrs.size)return;
    const cm=mid();
    let newW=vbStart.w;
    if(ptrs.size>=2&&startDist>0){
      const d=dist();
      if(d>0)newW=clamp(vbStart.w*startDist/d,MINW,MAXW);
    }
    const cmU=ptUnderStart(cm.x,cm.y);
    const k=newW/vbStart.w;
    vb.w=newW;vb.h=vbStart.h*k;
    vb.x=anchor.x-(cmU.x-vbStart.x)*k;
    vb.y=anchor.y-(cmU.y-vbStart.y)*k;
    clampVB();
    applyVB();
  }
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    const p=ptrs.get(e.pointerId);
    moved+=Math.hypot(e.clientX-p.x,e.clientY-p.y);
    p.x=e.clientX;p.y=e.clientY;
    if(!vbStart)return;
    if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;doPan();});}
  });
  function up(e){
    const was=ptrs.size;
    ptrs.delete(e.pointerId);
    if(ptrs.size>0){beginGesture();return;}
    vbStart=null;
    if(was===1&&moved<12&&performance.now()-downT<600){
      const g=e.target.closest&&e.target.closest('g.city');
      if(busy)return;
      if(g){
        const id=+g.dataset.id;
        // 已选己方城时点其相邻城 → 直接进入出兵（少一步导航）
        if(selected>=0&&selected!==id&&C(selected).owner===state.player&&ADJ[selected].includes(id)){
          openArmyModal(selected,id);
        }else select(id);
      }
      else deselect();
    }
  }
  svg.addEventListener('pointerup',up);
  svg.addEventListener('pointercancel',up);
  svg.addEventListener('pointerleave',e=>{if(ptrs.has(e.pointerId))up(e);});
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const k=e.deltaY>0?1.13:0.885;
    const newW=clamp(vb.w*k,MINW,MAXW);
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    const kk=newW/vb.w;
    vb.x=sp.x-(sp.x-vb.x)*kk;vb.y=sp.y-(sp.y-vb.y)*kk;
    vb.w=newW;vb.h*=kk;
    clampVB();
    applyVB();
  },{passive:false});
})();

          <button class="btn ${hostile?'atk':'mov'}" style="flex:none;flex-direction:row;padding:12px 9px" data-act="quick:${n}" ${fresh<500?'disabled':''} title="${hostile?'全军即刻出击':'移防一半兵力'}">

/* 面板内嵌控件绑定（滑杆/估算实时刷新） */
function bindPanelInline(){
  const p=$('#panel');
  // 征兵滑杆
  const irs=p.querySelector('#ir-slider');
  if(irs){
    const c=C(selected),rm=recruitMult(c);
    const upd=()=>{
      const n=+irs.value;
      p.querySelector('#ir-n').textContent=n.toLocaleString();
      p.querySelector('#ir-g').textContent=fmtG(n*RG*rm);
      p.querySelector('#ir-f').textContent=fmtG(n*RF*rm);
    };
    irs.addEventListener('input',upd);upd();
    p.querySelectorAll('[data-irq]').forEach(b=>b.onclick=()=>{
      const max=+p.querySelector('.inline-box').dataset.max;
      irs.value=Math.max(100,Math.floor(max*+b.dataset.irq/100)*100);upd();Sound.play('tap');
    });
  }
  // 出兵滑杆
  const ias=p.querySelector('#ia-slider');
  if(ias&&armyTarget>=0){
    const from=selected,to=armyTarget;
    const A=C(from),B=C(to),hostile=B.owner!==state.player;
    const fresh=A.troops-A.tired;
    const picked=()=>[...p.querySelectorAll('input[data-iag]:checked')].map(x=>state.generals.find(g=>g.id===+x.dataset.iag));
    const upd=()=>{
      // 统御上限随勾选武将实时变化
      const cap=Math.max(500,Math.min(fresh,leadCap(picked())));
      ias.max=cap;
      if(+ias.value>cap)ias.value=cap;
      const capEl=p.querySelector('#ia-cap');
      if(capEl)capEl.textContent=fmtT(Math.min(fresh,leadCap(picked())));
      const n=+ias.value;
      p.querySelector('#ia-n').textContent=n.toLocaleString();
      const est=p.querySelector('#ia-est');
      if(hostile){
        const ap=atkPowerOf(n,picked(),from,to),dp=defPowerOf(to),r=ap/Math.max(1,dp);
        let txt,col;
        if(r>1.45){txt='🔥 胜算极大';col='#6fe89a'}
        else if(r>1.08){txt='✅ 略占优势';col='#a8e06f'}
        else if(r>0.85){txt='⚖️ 势均力敌';col='#e8c96a'}
        else{txt='☠️ 凶多吉少';col='#ff7a7a'}
        const tn=terrainNote(from,to);
        est.innerHTML=`我 <b>${fmtG(ap)}</b> ⚡ 敌 <b>${fmtG(dp)}</b> · <span style="color:${col};font-weight:700">${txt}</span>
        <div class="dim" style="font-size:11.5px;margin-top:2px">${tn?tn+' · ':''}留守 ${fmtT(A.troops-n)}</div>`;
      }else{
        est.innerHTML=`调动后本城留守 <b>${fmtT(A.troops-n)}</b>，${B.name} 兵力 <b>${fmtT(B.troops+n)}</b>
        <div class="dim" style="font-size:11.5px;margin-top:2px">${techDone(state.player,'yi')?'📖 驿传：移防即刻可战':'移防之兵需休整一回合'}</div>`;
      }
    };
    ias.addEventListener('input',upd);
    p.querySelectorAll('input[data-iag]').forEach(x=>x.addEventListener('change',upd));
    p.querySelectorAll('[data-iaq]').forEach(b=>b.onclick=()=>{
      ias.value=Math.max(500,Math.floor(+ias.max*+b.dataset.iaq/100)*100);upd();Sound.play('tap');
    });
    upd();
  }
}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||busy)return;
  const act=b.dataset.act;
  Sound.play('tap');
  if(act==='close')return deselect();
  if(act==='recruit'){recruitOpen=!recruitOpen;armyTarget=-1;return renderPanel();}
  if(act==='qrec')return doQuickRecruit(selected);
  if(act==='ir-go')return doInlineRecruit();
  if(act==='ia-cancel'){armyTarget=-1;return renderPanel();}
  if(act==='ia-go')return doInlineArmy();
  if(act.startsWith('quick:'))return doQuickArmy(selected,+act.slice(6));
  if(act.startsWith('strat-'))return doStrat(selected,act.slice(6));
  if(act.startsWith('dev-'))return doDev(selected,act.slice(4));
  if(act.startsWith('army:')){armyTarget=+act.slice(5);recruitOpen=false;return renderPanel();}
  if(act.startsWith('armyfrom:'))return openArmyModal(+act.slice(9),selected);
});
function doInlineRecruit(){
  const c=C(selected),f=F(state.player);
  const sl=$('#panel').querySelector('#ir-slider');
  if(!sl||c.recUsed)return;
  const n=+sl.value,rm=recruitMult(c);
  f.gold-=n*RG*rm;f.food-=n*RF*rm;
  c.troops+=n;c.tired+=n;c.recUsed=true;recruitOpen=false;
  addLog(`${c.name} 征募新兵 ${n} 人`);
  Sound.play('coin');
  toast(`⚔️ ${c.name} 征募 ${n.toLocaleString()} 名新兵`);
  renderAll();save();
}
function doInlineArmy(){
  const from=selected,to=armyTarget;
  if(to<0)return;
  const sl=$('#panel').querySelector('#ia-slider');
  const n=+sl.value;
  const gsel=[...$('#panel').querySelectorAll('input[data-iag]:checked')].map(x=>+x.dataset.iag);
  const B=C(to),hostile=B.owner!==state.player;
  armyTarget=-1;
  busy=true;deselectKeepPanel();
  animateMarch(from,to,FACTS[state.player].color,()=>{
    if(hostile){
      const r=doBattle(from,to,n,gsel);
      renderAll();save();
      showBattleModal(r);
      busy=false;
    }else{
      doTransfer(from,to,n,gsel);
      toast(`🚚 ${n.toLocaleString()} 兵移驻 ${B.name}`);
      busy=false;
      select(to);renderAll();save();
    }
  });
}
/* 兼容旧入口（地图点击直达出兵）：现为面板内嵌 */
function openArmyModal(from,to){
  selected=from;armyTarget=to;recruitOpen=false;
  renderMap();renderPanel();
  $('#panel').classList.add('show');
  document.body.classList.add('panel-open');
}

/* ---- 内政 ---- */
function doDev(cid,kind){
  const c=C(cid),f=F(state.player);
  if(c.devUsed)return;
  const lvNow=kind==='farm'?c.farm:kind==='comm'?c.comm:c.wall;
  if(lvNow>=maxLv(c,kind))return;
  let cost,label;
  if(kind==='farm'){cost=devCost(c.farm);label='农业';}
  else if(kind==='comm'){cost=devCost(c.comm);label='商业';}
  else{cost=wallCost(c.wall);if(hasSkillIn(cid,'zhu'))cost=Math.round(cost/2);label='城防';}
  if(f.gold<cost){toast('💰 金钱不足');return;}
  f.gold-=cost;c.devUsed=true;
  if(kind==='farm')c.farm++;else if(kind==='comm')c.comm++;else c.wall++;
  const lv=kind==='farm'?c.farm:kind==='comm'?c.comm:c.wall;
  addLog(`${c.name} ${label}提升至 ${lv} 级`);
  Sound.play('coin');
  toast(`✨ ${c.name} ${label} → Lv.${lv}`);
  renderAll();save();
}
/* ---- 无弹窗快捷操作 ---- */
function doQuickRecruit(cid){
  const c=C(cid),f=F(state.player);
  if(c.recUsed)return;
  const rm=recruitMult(c),rg=RG*rm,rf=RF*rm;
  const n=Math.min(2000,RECRUIT_CAP,cityCap(c)-c.troops,Math.floor(f.gold/rg/100)*100,Math.floor(f.food/rf/100)*100);
  if(n<100){toast('💰 金钱或粮草不足');return;}
  f.gold-=n*rg;f.food-=n*rf;
  c.troops+=n;c.tired+=n;c.recUsed=true;
  Sound.play('coin');
  toast(`⚡ ${c.name} 速征 ${n.toLocaleString()} 兵`);addLog(`${c.name} 速征 ${n} 兵`);
  renderAll();save();
}
function doQuickArmy(from,to){
  const A=C(from),B=C(to);
  const hostile=B.owner!==state.player;
  const fresh=A.troops-A.tired;
  if(fresh<500){toast('可战之兵不足');return;}
  const gens=generalsIn(from);
  const cap=Math.min(fresh,leadCap(gens));      // 统御上限
  const n=hostile?cap:Math.max(500,Math.floor(cap/2/100)*100);
  const gsel=gens.map(g=>g.id);
  busy=true;deselectKeepPanel();
  animateMarch(from,to,FACTS[state.player].color,()=>{
    if(hostile){
      const r=doBattle(from,to,n,gsel);
      renderAll();save();
      showBattleModal(r);
      busy=false;
    }else{
      doTransfer(from,to,n,gsel);
      toast(`🚚 ${n.toLocaleString()} 兵移驻 ${B.name}`);
      busy=false;
      select(to);renderAll();save();
    }
  });
}
function showBattleModal(r){
  const A=C(r.from),D=C(r.to);
  const m=modal(`
    <h3>⚔️ ${A.name} → ${D.name} 之战</h3>
    <div class="b-side"><span style="color:${FACTS[r.attFid].color}">攻 ${FACTS[r.attFid].name}军 · ${r.attLead}</span><span>${r.commit.toLocaleString()} 兵</span></div>
    <div class="b-side"><span style="color:${FACTS[r.defFid].color}">守 ${FACTS[r.defFid].name}军 · ${r.defLead}</span><span>${(r.defLoss+(r.won?0:C(r.to).troops)).toLocaleString()} 兵</span></div>
    <div id="bt-stage"><div class="battle-stage">⚔️</div>
    <div style="text-align:center" class="dim">两军交锋，杀声震天…</div></div>
  `,{lock:true});
  Sound.play('battle');
  if(r.duel)setTimeout(()=>Sound.play('duel'),400);
  setTimeout(()=>{
    const ok=r.won;

    m.querySelector('#bt-stage').innerHTML=`
      ${r.duel?`<div class="duel">⚡ 阵前单挑：<b>${r.duel.a}</b> 对阵 <b>${r.duel.d}</b><br>${r.duel.text}</div>`:''}
      <div class="b-result ${ok?'win':'lose'}">${ok?'🎉 攻克 '+D.name+' ！':'💥 攻势受挫，败退而归'}</div>
      <div style="text-align:center;font-size:14px;line-height:2">
        我军伤亡 <b style="color:#ff9a9a">${r.attLoss.toLocaleString()}</b>　敌军${ok?'全灭':'伤亡'} <b style="color:#9ad0ff">${r.defLoss.toLocaleString()}</b>
        ${ok?`<br>${fmtT(r.commit-r.attLoss)} 大军进驻 ${D.name}（需休整）`:''}
        ${r.joined?`<br>💫 在野名将 <b style="color:#e8c96a">${r.joined.name}·${r.joined.war}</b> 慕名来投！`:''}
      </div>
      <div class="row"><button class="btn primary" id="bt-ok">确 定</button></div>`;
    m.querySelector('#bt-ok').onclick=()=>{
      closeModal();
      if(r.won)select(r.to);
      if(state.pendingCaptives.length)showCaptives(()=>checkVictory());
      else checkVictory();
    };
  },r.duel?1500:1000);
}
/* ---- 俘虏处置 ---- */
function showCaptives(cb){
  const gid=state.pendingCaptives[0];
  const g=state.generals.find(x=>x.id===gid);
  if(!g){state.pendingCaptives.shift();
    if(state.pendingCaptives.length)return showCaptives(cb);
    save();return cb&&cb();}
  const gs=gensOf(state.player);
  const charm=gs.length?Math.max(...gs.map(x=>x.cha)):60;
  const p=clamp(0.7-(g.loy||80)/150+charm/400+(courtHas(state.player,'ren')?0.15:0),0.05,0.9);
  const m=modal(`<h3>⛓ 阵前得将 · ${g.name}</h3>
    <div class="b-side"><span>统 ${g.war} · 武 ${g.wu} · 智 ${g.int}</span><span>${g.skill?'特技·'+SKILLS[g.skill].name:'无特技'} · 忠诚 ${g.loy}</span></div>
    <div style="font-size:13.5px;line-height:1.9" class="dim">${g.name} 被我军生擒，绑缚帐前。是劝其归降，还是放归山林？</div>
    <button class="btn gold wide" id="cp-rec"><span>🙏 劝降（成算约 ${Math.round(p*100)}%）</span></button>
    <button class="btn wide" id="cp-rel"><span>🕊 释放（归隐在野）</span></button>`,{lock:true});
  const done=()=>{
    state.pendingCaptives.shift();
    save();renderAll();closeModal();
    if(state.pendingCaptives.length)showCaptives(cb);
    else cb&&cb();
  };
  m.querySelector('#cp-rec').onclick=()=>{
    if(tryRecruitCaptive(g,state.player)){
      Sound.play('win');toast(`🎉 ${g.name} 纳头便拜，愿效犬马之劳！`);addLog(`劝降 ${g.name} 成功`);
    }else{
      Sound.play('lose');toast(`💨 ${g.name} 宁死不降，放归山林`);addLog(`劝降 ${g.name} 未果`);
      releaseCaptive(g);
    }
    done();
  };
  m.querySelector('#cp-rel').onclick=()=>{
    releaseCaptive(g);
    toast(`🕊 ${g.name} 拜谢而去`);addLog(`释放 ${g.name}`);
    done();
  };
}

/* 武将调驻：选择目的城 */
function showMoveGen(gid){
  const g=state.generals.find(x=>x.id===gid);
  if(!g)return;
  const rows=cityIdsOf(state.player).map(i=>{
    const c=C(i);
    const here=g.city===i;
    const gov=governorOf(i);
    return `<button class="btn wide" data-mvto="${i}" ${here?'disabled':''} style="margin-top:6px">
      <span>${c.cap?'★':''}${c.name}${here?'（现驻）':''}</span>
      <small>兵 ${fmtT(c.troops)}/${fmtT(cityCap(c))} · ${generalsIn(i).length} 将${gov?' · 太守'+gov.name:''}</small>
    </button>`}).join('');
  const m=modal(`<h3>🐎 调驻 · ${g.name} <small class="dim">（统御 ${fmtT(effWar(g)*300)} · 100金）</small></h3>${rows}
    <div class="row"><button class="btn" id="mv-back">返 回</button></div>`);

    if(moveGeneral(gid,+b.dataset.mvto)){closeModal();showRoster('mine');}

}
function showConfer(gid){
  const g=state.generals.find(x=>x.id===gid);
  if(!g)return;
  const f=F(state.player),idx=rankIdxOf(state.player);
  const cur=titleOf(g);
  const opts=TITLES.map(t=>{
    const used=countTitle(state.player,t.id);
    const free=used<t.max;
    let why='';
    if(t.req>idx)why='需官居 '+RANKS[t.req].name;
    else if(cur&&t.bonus<=cur.bonus)why='不及现职';
    else if(!free)why='此衔已授';
    else if(f.gold<t.cost)why='金钱不足';
    return `<button class="btn wide" data-t="${t.id}" ${why?'disabled':''} style="margin-top:6px">
      <span>${t.name} <small style="color:#9ae6a8">统率 +${t.bonus}</small></span>
      <small>${why||t.cost.toLocaleString()+' 金'}</small></button>`;
  }).join('');
  const m=modal(`<h3>⚜ 授衔 · ${g.name}${cur?'（现任'+cur.name+'）':''}</h3>${opts}
    <div class="row"><button class="btn" id="cf-back">返 回</button></div>`);
  m.querySelector('#cf-back').onclick=()=>{closeModal();showRoster();};
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const t=TITLES.find(x=>x.id===b.dataset.t);
    f.gold-=t.cost;g.title=t.id;
    g.loy=Math.min(100,(g.loy||80)+15);
    Sound.play('coin');
    toast(`⚜ 拜 ${g.name} 为 ${t.name}！统率 ${effWar(g)}，忠诚 ${g.loy}`);
    addLog(`拜 ${g.name} 为 ${t.name}`);
    save();renderAll();closeModal();showRoster();
  });
}
/* ---- 军技府 ---- */
function showTechs(){
  const fid=state.player,f=F(fid);
  const cur=f.researching?TECHS.find(t=>t.id===f.researching.id):null;
  const rows=TECHS.map(t=>{
    const done=f.techs.includes(t.id);

    else if(cur&&cur.id===t.id)st=`<span style="color:#e8c96a">研习中 · 剩 ${f.researching.left} 回合</span>`;

      <div class="g-info"><b>${t.name}</b><div class="g-stats">${t.desc} · ${t.cost.toLocaleString()} 金 · ${t.turns} 回合</div></div>

/* ---- 外交 ---- */
function showDiplomacy(){
  const f=F(state.player);
  const rows=MAJORS.filter(x=>x!==state.player&&F(x).alive).map(x=>{
    const fd=FACTS[x];
    const n=cityIdsOf(x).length;
    const troops=cityIdsOf(x).reduce((a,i)=>a+C(i).troops,0);
    const cost=500+n*300;
    const tl=truceLeft(x);
    return `<div class="g-row">
      <div class="g-info"><b style="color:${fd.color}">${fd.name} · ${fd.leader}</b>
        <div class="g-stats">${n} 城 · 总兵力 ${fmtT(troops)} · ${tl>0?`<span style="color:#9ae6a8">停战 剩 ${tl} 回合</span>`:'<span style="color:#ff9a9a">无盟约</span>'}</div></div>
      <button class="btn" style="padding:7px 10px;min-height:0;flex:none" data-truce="${x}" ${f.gold<cost||tl>=12?'disabled':''}>
        <span style="font-size:13px">🤝 修好</span><small>${cost}金·停战6回合</small></button>
    </div>`}).join('');
  const m=modal(`<h3>🤝 外 交</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:6px">纳币修好可换停战之约：约期内对方不会进攻我方城池（可叠加，至多 12 回合）。约满之日，刀兵再起。</div>
    ${rows||'<div class="dim">天下已无对手</div>'}

  m.querySelectorAll('[data-truce]').forEach(b=>b.onclick=()=>{
    const x=b.dataset.truce;
    const cost=500+cityIdsOf(x).length*300;
    if(f.gold<cost)return;
    f.gold-=cost;
    if(!state.truce)state.truce={};
    state.truce[x]=Math.min(12,truceLeft(x)+6);
    Sound.play('coin');
    toast(`🤝 与 ${FACTS[x].leader} 缔结停战之约（${state.truce[x]} 回合）`);
    addLog(`纳币 ${cost} 金，与${FACTS[x].name}停战`);
    save();renderTopbar();closeModal();showDiplomacy();
  });
}
function checkRank(){
  if(!state)return;
  const idx=rankIdxOf(state.player);
  if(state.rkLast===undefined)state.rkLast=idx;
  if(idx>state.rkLast){
    state.rkLast=idx;
    Sound.play('win');
    toast(`🎉 晋位「${RANKS[idx].name}」！岁入 +${Math.round(RANKS[idx].inc*100)}%，可授更高将军号`);
    addLog(`晋位 ${RANKS[idx].name}`);

}

function aiConfer(fid){
  const f=F(fid),rk=rankIdxOf(fid);
  const cand=state.generals.filter(g=>g.fid===fid&&!g.title).sort((a,b)=>b.war-a.war)[0];
  if(!cand)return;
  const avail=TITLES.filter(t=>t.req<=rk&&f.gold>t.cost*2.5&&countTitle(fid,t.id)<t.max)
    .sort((a,b)=>b.bonus-a.bonus)[0];
  if(avail){f.gold-=avail.cost;cand.title=avail.id;cand.loy=Math.min(100,(cand.loy||80)+15);}
}
function aiResearch(fid){
  const f=F(fid);
  if(f.researching)return;
  const order=['shi','tun','qiang','shou','zheng','qixie','juntun','yi'];
  for(const id of order){
    if(f.techs.includes(id))continue;
    const t=TECHS.find(x=>x.id===id);
    if(f.gold>t.cost*3){startResearch(fid,id);break;}
    break;
  }
}
function aiTurn(fid,reports){
  const f=F(fid);
  if(!f.alive)return;
  const p=PERSONA[fid];
  aiConfer(fid);
  aiResearch(fid);
  const myIds=cityIdsOf(fid);
  // 武将调度：富余武将外派到无将之城（优先边境）
  {
    const noGen=myIds.filter(i=>generalsIn(i).length===0)
      .sort((a,b)=>(ADJ[b].some(m=>C(m).owner!==fid)?1:0)-(ADJ[a].some(m=>C(m).owner!==fid)?1:0));
    for(const tgt of noGen){
      const src=myIds.find(i=>generalsIn(i).length>=2);
      if(src===undefined)break;
      const gs=generalsIn(src);
      gs.sort((a,b)=>effWar(a)-effWar(b))[0].city=tgt; // 派次将赴任
    }
  }
  for(const cid of myIds){
    const c=C(cid);
    if(c.owner!==fid)continue;
    const hostileN=ADJ[cid].filter(n=>C(n).owner!==fid);
    const isBorder=hostileN.length>0;
    // 内政
    if(!c.devUsed){
      const mF=Math.min(9,maxLv(c,'farm')),mC=Math.min(9,maxLv(c,'comm'));
      if(isBorder&&c.wall<p.wallMax&&f.gold>wallCost(c.wall)+600){f.gold-=wallCost(c.wall);c.wall++;c.devUsed=true;}
      else if(c.farm<=c.comm&&c.farm<mF&&f.gold>devCost(c.farm)+500){f.gold-=devCost(c.farm);c.farm++;c.devUsed=true;}
      else if(c.comm<mC&&f.gold>devCost(c.comm)+500){f.gold-=devCost(c.comm);c.comm++;c.devUsed=true;}
    }
    // 征兵：打不动邻敌时蓄力攻坚
    let recTarget=p.rec;
    if(isBorder){
      const weakest=Math.min(...hostileN.map(n=>defPowerOf(n)));
      const myP=atkPowerOf(c.troops,generalsIn(cid),cid);
      if(weakest*1.05>myP)recTarget=Math.min(42000,p.rec+20000);
    }
    if(!c.recUsed&&isBorder&&c.troops<Math.min(recTarget,cityCap(c))){
      const rm=recruitMult(c);
      const n=Math.min(RECRUIT_CAP,cityCap(c)-c.troops,Math.floor(f.gold*0.6/(RG*rm)/100)*100,Math.floor(f.food*0.4/(RF*rm)/100)*100);
      if(n>=1000){f.gold-=n*RG*rm;f.food-=n*RF*rm;c.troops+=n;c.tired+=n;c.recUsed=true;}
    }
    // 进攻
    const fresh=c.troops-c.tired;
    if(fresh>4000){
      let thr=p.atk;
      if(fresh>p.rec*1.2)thr=p.atk*0.8;
      if(myIds.length>=15)thr*=0.62;
      else if(myIds.length>=12)thr*=0.8;
      thr=Math.max(myIds.length>=15?1.0:1.05,thr);
      const ratio=fresh>p.rec*1.2?0.9:0.85;
      const cityGens=generalsIn(cid);
      const lcap=leadCap(cityGens); // 统御上限
      let best=-1,bestScore=0;
      for(const n of hostileN){
        const t=C(n);
        if(t.owner===state.player&&truceLeft(fid)>0)continue;
        const need=defPowerOf(n)*thr+1000;
        const commit=Math.min(Math.floor(fresh*ratio),lcap);
        const myP=atkPowerOf(commit,cityGens,cid,n);
        if(myP>need){
          const score=(myP/Math.max(1,need))*(t.owner==='neutral'?p.neu:1);
          if(score>bestScore){bestScore=score;best=n;}
        }
      }
      if(best>=0){
        const commit=Math.min(Math.floor(fresh*ratio),lcap);
        const gids=cityGens.map(g=>g.id);
        const r=doBattle(cid,best,commit,gids);
        reports.push(r);
        continue;
      }
    }
    // 增援前线
    if(!isBorder&&c.troops>8000){
      const friends=ADJ[cid].filter(n=>C(n).owner===fid);
      const front=friends.find(n=>ADJ[n].some(m=>C(m).owner!==fid));
      const tgt=front!==undefined?front:friends[0];
      if(tgt!==undefined){
        const t=C(tgt);
        const n=Math.min(Math.floor((c.troops-4000)/100)*100,
          leadCap(generalsIn(cid)),Math.max(0,cityCap(t)-t.troops));
        if(n>=1000){
          c.troops-=n;c.tired=Math.min(c.tired,c.troops);
          t.troops+=n;t.tired+=n;
          state.generals.filter(g=>g.fid===fid&&g.city===cid).slice(1).forEach(g=>g.city=tgt);
        }
      }
    }
  }
}

</script>
<script>
'use strict';
/* ============================================================
 * 主流程：回合 / 胜负 / 入口绑定 / 初始化
 * ============================================================ */
function runSteps(steps){
  const next=()=>{const s=steps.shift();if(s)s(next);};
  next();
}
function endTurn(){
  if(busy)return;
  busy=true;
  deselect();closeModal();
  $('#turn-overlay').classList.add('show');
  setTimeout(()=>{
    const reports=[];
    MAJORS.filter(f=>f!==state.player&&F(f).alive).forEach(fid=>aiTurn(fid,reports));
    neutralRegen();
    incomeAll();
    advanceTime();
    randomEvent();
    const hist=checkHistory();
    save();
    renderAll();
    $('#turn-overlay').classList.remove('show');
    Sound.play('turn');
    toast(`${SEASON_EMO[state.season]} ${dateStr()} · 第 ${state.turn} 回合`);
    const steps=[];
    if(hist.length)steps.push(cb=>showHistoryModal(hist,cb));
    const mine=reports.filter(r=>r.involvesPlayer);
    if(mine.length)steps.push(cb=>showWarReport(mine,cb));
    if(Math.random()<0.25)steps.push(cb=>showChoiceEvent(cb));
    steps.push(cb=>{checkVictory();if(cb)cb();});
    runSteps(steps);
    busy=false;
  },700);
}
function checkVictory(){
  const myCities=cityIdsOf(state.player).length;
  if(myCities===0){
    Sound.play('lose');
    modal(`<h3 style="color:#ff7a7a">💀 大势已去</h3>
      <div style="font-size:15px;line-height:2">${dateStr()}，${FACTS[state.player].leader}兵败城失，霸业成空。<br>共历 ${state.turn} 回合。胜败兵家常事，重整旗鼓再来！</div>
      <div class="row"><button class="btn primary" id="vd-new">重 新 开 始</button></div>`,{lock:true})
      .querySelector('#vd-new').onclick=()=>{store.del(SAVE_KEY);location.reload();};
    return;
  }
  const colossus=MAJORS.find(f=>f!==state.player&&cityIdsOf(f).length>=AI_WIN);
  if(colossus){
    Sound.play('lose');
    modal(`<h3 style="color:#ff7a7a">🏯 天下易主</h3>
      <div style="font-size:15px;line-height:2">${dateStr()}，${FACTS[colossus].leader}并吞八荒，山河尽入${FACTS[colossus].name}手。${FACTS[state.player].leader}纵有壮志，大势已去……<br>共历 ${state.turn} 回合。</div>
      <div class="row"><button class="btn primary" id="vd-new2">重 整 河 山</button></div>`,{lock:true})
      .querySelector('#vd-new2').onclick=()=>{store.del(SAVE_KEY);location.reload();};
    return;
  }
  if(!state.warnBig){
    const big=MAJORS.find(f=>f!==state.player&&cityIdsOf(f).length>=15);
    if(big){state.warnBig=true;
      const msg=`⚠️ ${FACTS[big].leader}已据十五城，天下将倾，宜早图之！`;
      toast(msg);addLog(msg);}
  }
  if(state.won)return;
  const rivalsAlive=MAJORS.filter(f=>f!==state.player&&cityIdsOf(f).length>0);
  if(myCities>=WIN_CITIES||rivalsAlive.length===0){
    state.won=true;save();
    Sound.play('win');
    modal(`<h3 style="color:#6fe89a">👑 天下归一</h3>
      <div style="font-size:15px;line-height:2.1">${dateStr()}，${FACTS[state.player].leader}${rivalsAlive.length===0?'扫平群雄':'据'+myCities+'城'}，威加海内，天下大定！<br>
      历时 <b>${state.turn}</b> 回合（${state.year-200} 年征战）<br>麾下名将 <b>${gensOf(state.player).length}</b> 员</div>
      <div class="row"><button class="btn" id="vw-go">继续征伐</button><button class="btn primary" id="vw-new">再 来 一 局</button></div>`,{lock:true});
    $('#vw-go').onclick=closeModal;
    $('#vw-new').onclick=()=>{store.del(SAVE_KEY);location.reload();};
  }
}
function startGame(){
  showScreen('#screen-game');
  vb={x:70,y:-10,w:860,h:784};
  buildMap();renderTopbar();
  deselect();
}
/* ---- 绑定 ---- */
bindSeg('#diff-seg',b=>setupDiff=+b.dataset.d);
bindSeg('#wealth-seg',b=>setupWealth=+b.dataset.w);
bindSeg('#hist-seg',b=>setupHist=b.dataset.h==='1');
bindSeg('#neu-seg',b=>setupNeu=+b.dataset.n);
$('#btn-new').onclick=()=>{Sound.play('tap');buildSetup();showScreen('#screen-setup');};
$('#btn-back').onclick=()=>{Sound.play('tap');showScreen('#screen-menu');};
$('#btn-start').onclick=()=>{
  Sound.play('turn');
  newGame(setupFid,setupDiff,{wealth:setupWealth,hist:setupHist,neu:setupNeu});
  save();
  startGame();
  setTimeout(()=>{toast(`${SEASON_EMO[0]} ${FACTS[setupFid].leader}据${capOf(setupFid)}而起，点击城池开始经营！`)},400);
};
$('#btn-continue').onclick=()=>{
  if(loadSave()){Sound.play('turn');startGame();toast('▶ 已读取存档，继续征程');}
  else{toast('存档读取失败');$('#btn-continue').style.display='none';}
};
$('#btn-help0').onclick=()=>{Sound.play('tap');showHelp();};
$('#btn-endturn').onclick=endTurn;
$('#btn-log').onclick=()=>{Sound.play('tap');showLog();};
$('#btn-help').onclick=()=>{Sound.play('tap');showHelp();};
$('#btn-gmenu').onclick=()=>{Sound.play('tap');showGameMenu();};
$('#btn-gens').onclick=()=>{Sound.play('tap');showRoster();};
$('#btn-diplo').onclick=()=>{Sound.play('tap');showDiplomacy();};
$('#btn-tech').onclick=()=>{Sound.play('tap');showTechs();};
/* PWA */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
/* 初始化 */
(function(){
  if(store.get('sgbh_theme')==='light')document.body.classList.add('light');
  if(loadSave()){
    $('#btn-continue').style.display='block';
    startGame();
    setTimeout(()=>{
      toast('▶ 已恢复进度 · 重开请点右上 ☰');
      if(state.pendingCaptives&&state.pendingCaptives.length)showCaptives(()=>{});
    },350);
  }
})();

</script>
